      if (seq !== shopSeq || !shopping) return;
      if (!r.ok) { setList(shopping.list, r.status === 401 ? 'expired' : 'read-failed'); return; }
      const found = parseIngredients(data.text);
      if (found.length) setList(found, 'found');
      else setList(shopping.list, !data.read ? (data.kind === 'instagram' ? 'insta-blocked' : 'read-failed') : 'no-section');
    } catch (err) {
      console.warn(err);
      if (seq !== shopSeq || !shopping) return;
      setList(shopping.list, 'offline');
    }
  }

  const NOTES = {
    saved: ['전에 찾은 재료예요. 필요 없는 재료는 체크를 빼 주세요.', ''],
    found: ['링크에서 재료 {n}개를 찾았어요. 필요 없는 재료는 체크를 빼 주세요.', ''],
    pasted: ['붙여넣은 글에서 재료 {n}개를 찾았어요.', ''],
    'paste-none': ["붙여넣은 글에서 '재료' 목록을 찾지 못했어요. 재료를 직접 적어 주세요.", 'warn'],
    'no-section': ["링크에서 '재료' 목록을 찾지 못했어요. 영상에서 말로만 소개한 재료는 읽을 수 없어요. 글을 붙여넣거나 재료를 직접 적어 주세요.", 'warn'],
    'insta-blocked': ['인스타가 글을 보여주지 않았어요. 릴스 글을 복사해서 붙여넣거나 재료를 직접 적어 주세요.', 'warn'],
    'read-failed': ['링크를 읽지 못했어요. 글을 붙여넣거나 재료를 직접 적어 주세요.', 'warn'],
    offline: ['인터넷 연결을 확인해 주세요. 재료를 직접 적을 수도 있어요.', 'warn'],
    expired: ['로그인이 만료됐어요. 로그아웃했다가 다시 로그인해 주세요.', 'warn'],
    'no-link': ['레시피 글을 붙여넣거나 재료를 직접 적어 주세요.', ''],
    'no-reader': ['링크 읽기는 아직 준비 중이에요. 레시피 글을 붙여넣거나 재료를 직접 적어 주세요.', ''],
    'login-read': ['로그인하면 링크에서 재료를 찾아 드려요. 지금은 글을 붙여넣거나 재료를 직접 적어 주세요.', ''],
    manual: ['필요 없는 재료는 체크를 빼 주세요.', ''],
    photo: ['사진에서 재료 {n}개를 찾았어요. 글자가 틀렸으면 아래 읽은 글을 고치고 다시 찾아 주세요.', ''],
    'photo-none': ["사진에서 '재료' 목록을 찾지 못했어요. 아래 읽은 글을 확인해서 고치거나 재료를 직접 적어 주세요.", 'warn'],
    'photo-empty': ['사진에서 글자를 읽지 못했어요. 글자가 크고 선명한 사진이나 캡처 화면으로 다시 해 주세요.', 'warn'],
    'photo-failed': ['글자 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.', 'warn'],
  };

  /* ---------- 사진에서 글 읽기: Tesseract.js, running on the phone (free; the photo never leaves it) ---------- */
  const TESSERACT_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  let tesseractLoad = null, ocrWorker = null, ocrProgress = () => {};
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (!tesseractLoad) {
      tesseractLoad = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = TESSERACT_SRC;
        s.onload = () => resolve(window.Tesseract);
        s.onerror = () => { tesseractLoad = null; s.remove(); reject(new Error('tesseract load failed')); };
        document.head.append(s);
      });
    }
    return tesseractLoad;
  }
  function getOcrWorker() {
    if (!ocrWorker) {
      // Korean + English data are downloaded once, then kept by the browser.
      ocrWorker = loadTesseract()
        .then((T) => T.createWorker(['kor', 'eng'], 1, { logger: (m) => ocrProgress(m) }))
        .catch((e) => { ocrWorker = null; throw e; });
    }
    return ocrWorker;
  }
  // Before reading: grayscale, dark mode flipped to dark-on-light, and sized so text is big enough.
  // Phone screenshots are narrow (~600px), so they are enlarged to ~1500px wide (at most 3x); big photos
  // are shrunk to 2000px wide. Tested on a dark-mode Instagram caption: this fixed most misread units.
  async function prepareImage(file) {
    let bmp;
    try { bmp = await createImageBitmap(file); } catch { return file; }
    const scale = bmp.width < 1500 ? Math.min(3, 1500 / bmp.width) : Math.min(1, 2000 / bmp.width);
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    const g = c.getContext('2d', { willReadFrequently: true });
    g.imageSmoothingQuality = 'high';
    g.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const img = g.getImageData(0, 0, c.width, c.height), d = img.data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) {
      const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      d[i] = d[i + 1] = d[i + 2] = y;
      sum += y;
    }
    if (sum / (d.length / 4) < 110) for (let i = 0; i < d.length; i += 4) d[i] = d[i + 1] = d[i + 2] = 255 - d[i];
    g.putImageData(img, 0, 0);
    return new Promise((resolve) => c.toBlob((b) => resolve(b || file), 'image/png'));
  }
  // Fixes for what Tesseract typically gets wrong in recipe text.
  function fixOcrText(text) {
    return String(text).split('\n').map((line) => {
      let l = line;
      // Spaced-out syllables: "김 치 찌 개" or "< 만 들 기 >"
      l = l.replace(/(?:(?<=^|[\s<(\[])[가-힣]\s+){2,}[가-힣](?=$|[\s>)\]])/g, (m) => m.replace(/\s+/g, ''));
      // Arrows and bullets read as letters before a heading: "ㄷㄷ 소스:", "또 재료:", "= 재료:"
      l = l.replace(/^\s*\S{1,3}\s+(?=(주\s*재료|부\s*재료|재료|양념\s*장?|소스|드레싱)\s*[:：])/, '');
      // Units: "g" read as 9 or 6 ("2006" → "200g", "56" → "5g"), "T" read as 7 or ㅠ ("37" → "3T", "1ㅠ" → "1T"),
      // "ml" read as "m!" or "mI". Only bare numbers at the end of an amount are changed.
      l = l.replace(/(^|[\s(])(\d*[05])[69](?=$|[\s,)])/g, '$1$2g')
        .replace(/(\d)\s?ㅠ(?=$|[\s,)])/g, '$1T')
        .replace(/(^|[\s(])(\d)7(?=$|[\s,)])/g, '$1$2T')
        .replace(/(\d)\s?m[!lI|]{1,2}(?=$|[\s,)])/g, '$1ml');
      return l;
    }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  async function readPhoto(file, onProgress) {
    ocrProgress = onProgress || (() => {});
    const worker = await getOcrWorker();
    const image = await prepareImage(file);
    let { data } = await worker.recognize(image);
    // A picture with only a line or two of text can come out as noise with automatic layout;
    // read it again as one block of text and keep whichever has more Korean in it.
    const hangul = (t) => (String(t).match(/[가-힣]/g) || []).length;
    if (hangul(data.text) < 8) {
      await worker.setParameters({ tessedit_pageseg_mode: '6' });
      try {
        const again = (await worker.recognize(image)).data;
        if (hangul(again.text) > hangul(data.text)) data = again;
      } finally {
        await worker.setParameters({ tessedit_pageseg_mode: '3' });
      }
    }
    return fixOcrText(data.text || '');
  }
  window.readPhoto = readPhoto; // handy for checking an image in the console

  async function readRecipePhoto(file) {
    if (!shopping) return;
    const seq = ++shopSeq;
    renderShop('ocr');
    try {
      const text = await readPhoto(file, (m) => {
        if (seq !== shopSeq) return;
        const line = document.getElementById('ocr-status');
        if (!line) return;
        const pct = Math.round((m.progress || 0) * 100);
        line.textContent = m.status === 'recognizing text' ? `글자를 읽고 있어요… ${pct}%`
          : /traineddata/.test(m.status || '') ? `처음 한 번만 한국어 글자 데이터를 내려받고 있어요… ${pct}%`
          : '글자 읽기를 준비하고 있어요…';
      });
      if (seq !== shopSeq || !shopping) return;
      shopping.pasteText = text;
      const found = text ? parseIngredients(text) : [];
      if (found.length) setList(found, 'photo');
      else { shopping.note = text ? 'photo-none' : 'photo-empty'; renderShop('list'); }
    } catch (err) {
      console.warn(err);
      if (seq !== shopSeq || !shopping) return;
      shopping.note = 'photo-failed';
      renderShop('list');
    }
  }

  function renderShop(state) {
    if (!shopping) return;
    const msg = (text, cls) => el('p', { class: 'shop-msg' + (cls ? ' ' + cls : '') }, text);
    shopBody.replaceChildren();
    shopAdd.hidden = true;
    shopRetry.hidden = true;

    if (state === 'ocr') {
      shopBody.append(el('div', { class: 'shop-loading', role: 'status' }, el('span', { class: 'spinner' }),
        el('span', { id: 'ocr-status' }, '글자 읽기를 준비하고 있어요…')));
      return;
    }
    if (state === 'loading') {
      shopBody.append(el('div', { class: 'shop-loading', role: 'status' }, el('span', { class: 'spinner' }), '링크를 읽고 있어요…'));
      return;
    }
    if (state === 'done') {
      shopBody.append(msg(shopping.added
        ? `장보기 앱의 슈퍼마켓 목록에 ${shopping.added}개를 넣었어요.`
        : '고른 재료가 이미 장보기 목록에 모두 있어요.'));
      return;
    }

    const [note, cls] = NOTES[shopping.note] || NOTES.manual;
    shopBody.append(msg(note.replace('{n}', shopping.count), cls));

    const have = ownedNames();
    if (shopping.list.length) {
      const ul = el('ul', { class: 'ing-list' });
      shopping.list.forEach((ing, i) => {
        const owned = have.has(ing.name.trim().toLowerCase());
        const box = el('input', { type: 'checkbox', id: 'ing-' + i, 'data-i': String(i) });
        box.checked = ing.on;
        ul.append(el('li', { class: owned ? 'have' : null },
          el('label', { for: 'ing-' + i }, box,
            el('span', { class: 'ing-name' }, ing.name, owned ? el('span', { class: 'ing-have' }, '· 이미 목록에 있어요') : null),
            ing.amount ? el('span', { class: 'ing-amount' }, ing.amount) : null)));
      });
      shopBody.append(ul);
    }

    // Type a 재료 yourself
    const addInput = el('input', { id: 'shop-new', placeholder: '재료 직접 추가 (예: 두부 1모)', autocomplete: 'off', 'aria-label': '재료 직접 추가' });
    const addBtn = el('button', { class: 'btn line', type: 'button' }, '추가');
    const addOne = () => {
      const x = splitNameAmount(addInput.value) || (addInput.value.trim() ? { name: addInput.value.trim().slice(0, 20), amount: '' } : null);
      if (!x) { addInput.focus(); return; }
      if (!shopping.list.some((y) => y.name === x.name)) shopping.list.push({ ...x, on: true });
      if (!['found', 'saved', 'pasted', 'photo'].includes(shopping.note)) shopping.note = 'manual';
      renderShop('list');
      const again = document.getElementById('shop-new');
      if (again) again.focus();
    };
    addBtn.addEventListener('click', addOne);
    addInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addOne(); } });
    shopBody.append(el('div', { class: 'acct-row' }, addInput, addBtn));

    // A photo or screenshot of a recipe: its text is read on the phone and put in the box below.
    const photoInput = el('input', { type: 'file', accept: 'image/*', id: 'shop-photo', hidden: true });
    const photoBtn = el('button', { class: 'btn line photo-btn', type: 'button' });
    photoBtn.innerHTML = ICONS.camera;
    photoBtn.append('사진에서 글 읽기');
    photoBtn.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', () => { const f = photoInput.files && photoInput.files[0]; if (f) readRecipePhoto(f); });
    shopBody.append(el('div', { class: 'acct-row' }, photoBtn, photoInput));

    // Paste a recipe text (e.g. a reel's caption), or fix the text read from a photo
    const fromPhoto = /^photo/.test(shopping.note) && !!shopping.pasteText;
    const area = el('textarea', { id: 'shop-paste', placeholder: '레시피 글이나 릴스 설명을 붙여넣으세요', 'aria-label': '레시피 글' });
    area.value = shopping.pasteText || '';
    area.addEventListener('input', () => { shopping.pasteText = area.value; });
    const findBtn = el('button', { class: 'btn line', type: 'button' }, '이 글에서 재료 찾기');
    findBtn.addEventListener('click', () => {
      const t = area.value.trim();
      if (!t) { area.focus(); return; }
      shopping.pasteText = area.value;
      const found = parseIngredients(t);
      if (found.length) setList(found, 'pasted'); else { shopping.note = 'paste-none'; renderShop('list'); }
    });
    const details = el('details', { class: 'paste' },
      el('summary', null, fromPhoto ? '사진에서 읽은 글 (틀린 글자를 고칠 수 있어요)' : '레시피 글 붙여넣기'),
      area, el('div', { class: 'acct-row' }, findBtn));
    if (!shopping.list.length || fromPhoto) details.open = true;
    shopBody.append(details);

    if (!canAddToShopping()) {
      const go = el('button', { class: 'btn line', type: 'button' }, '로그인하기');
      go.addEventListener('click', () => { closeShop(); openAcct(); });
      shopBody.append(msg('장보기 앱에 넣으려면 오른쪽 위 사람 아이콘에서 구글로 로그인해 주세요.'), el('div', { class: 'acct-row' }, go));
    } else {
      shopAdd.hidden = false;
      updateShopCount();
    }
    if (shopping.url && canReadLinks()) shopRetry.hidden = false;
  }

  function updateShopCount() {
    const n = shopping ? shopping.list.filter((x) => x.on).length : 0;
    shopAdd.textContent = n ? `슈퍼마켓에 ${n}개 넣기` : '슈퍼마켓에 넣기';
    shopAdd.disabled = !n;
  }
  shopBody.addEventListener('change', (e) => {
    const box = e.target.closest('.ing-list input');
    if (!box || !shopping) return;
    const x = shopping.list[Number(box.dataset.i)];
    if (x) x.on = box.checked;
    updateShopCount();
  });
  shopAdd.addEventListener('click', () => {
    if (!shopping || !canAddToShopping()) return;
    const picks = shopping.list.filter((x) => x.on);
    if (!picks.length) return;
    // Remember this menu's 재료 for next time.
    const day = clone(days[shopping.key]);
    const target = (day[shopping.meal] || []).find((x) => x.id === shopping.id);
    if (target) {
      target.ing = { dish: '', src: true, kind: '', list: shopping.list.map((x) => ({ name: x.name, amount: x.amount })) };
      target.shopped = true;
      saveDay(shopping.key, day);
    }
    // Only the amount goes along as the memo; the menu's name stays out of the 장보기 app.
    shopping.added = window.cloud.addToShopping(picks.map((p) => ({ name: p.name, note: p.amount })));
    renderShop('done');
  });

  /* ---------- 레시피북: a public Notion recipe database, grouped by its 분류 ---------- */
  // The book's link is kept in the household (shared with the family) or, signed out, on this device;
  // the last list read is kept here too, so the book opens at once and refreshes behind.
  const BOOK_URL = READER_URL.replace(/\/read$/, '/book');
  const bookEl = document.getElementById('book');
  const bookBody = document.getElementById('book-body');
  const bookChange = document.getElementById('book-change');
  let bookOpen = false, bookLoading = false, bookError = '', bookEditing = false, bookQuery = '', bookCat = 'all';
  let bookData = local.get('book-data', null); // { url, at, data }
  const bookUrl = () => (window.cloud && window.cloud.recipeBook) || local.get('book-url', '');
  const isKidCategory = (c) => /아이|어린이|키즈|kid/i.test(c || '');

  function openBook() {
    bookOpen = true;
    bookEl.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    renderBook();
    refreshBook();
  }
  function closeBook() {
    bookOpen = false; bookEditing = false;
    bookEl.hidden = true;
    document.documentElement.style.overflow = '';
  }
  document.getElementById('book-open').addEventListener('click', openBook);
  document.getElementById('book-close').addEventListener('click', closeBook);
  bookEl.addEventListener('click', (e) => { if (e.target === bookEl) closeBook(); });
  bookChange.addEventListener('click', () => { bookEditing = true; renderBook(); });

  async function refreshBook(force) {
    const url = bookUrl();
    if (!url || !canReadLinks() || bookLoading) return;
    if (!force && bookData && bookData.url === url && Date.now() - bookData.at < 60 * 1000) return;
    bookLoading = true; bookError = '';
    renderBook();
    try {
      const token = await window.cloud.idToken();
      const r = await fetch(BOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ url }),
      });
      const data = await r.json().catch(() => null);
      if (r.ok && data && data.books && data.books.length) {
        bookData = { url, at: Date.now(), data };
        local.put('book-data', bookData);
      } else {
        bookError = r.status === 401 ? '로그인이 만료됐어요. 로그아웃했다가 다시 로그인해 주세요.'
          : r.ok ? '이 페이지에서 레시피 데이터베이스를 찾지 못했어요. 레시피 목록이 있는 페이지 링크인지 확인해 주세요.'
          : '레시피북을 읽지 못했어요. 노션에서 페이지가 웹에 공개되어 있는지 확인해 주세요.';
      }
    } catch (err) {
      console.warn(err);
      bookError = '인터넷 연결을 확인하고 다시 열어 주세요.';
    }
    bookLoading = false;
    if (bookOpen) renderBook();
  }

  function saveBookUrl(raw) {
    const url = normUrl(raw);
    if (!url || !/notion\.(so|site|com)/i.test(new URL(url).hostname)) return false;
    local.put('book-url', url);
    if (window.cloud && window.cloud.live && window.cloud.setRecipeBook) window.cloud.setRecipeBook(url);
    bookData = null; bookEditing = false; bookCat = 'all'; bookQuery = '';
    return true;
  }

  function renderBook() {
    if (!bookOpen) return;
    const msg = (text, cls) => el('p', { class: 'shop-msg' + (cls ? ' ' + cls : '') }, text);
    const sub = document.getElementById('book-sub');
    bookBody.replaceChildren();
    const url = bookUrl();
    bookChange.hidden = !url || bookEditing;

    if (!url || bookEditing) {
      sub.textContent = '노션의 레시피 목록을 분류대로 보여드려요.';
      const input = el('input', { class: 'book-search', id: 'book-link', inputmode: 'url', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
        placeholder: '노션 레시피북 링크를 붙여넣으세요', 'aria-label': '노션 레시피북 링크' });
      input.value = url;
      const save = el('button', { class: 'btn primary', type: 'button' }, '연결');
      const err = msg('', 'err'); err.hidden = true;
      save.addEventListener('click', () => {
        if (saveBookUrl(input.value)) { renderBook(); refreshBook(true); }
        else { err.hidden = false; err.textContent = '노션 페이지 링크를 붙여넣어 주세요.'; input.focus(); }
      });
      bookBody.append(msg('레시피 목록이 있는 노션 페이지의 링크를 붙여넣어 주세요. 노션에서 그 페이지가 "웹에 공개"되어 있어야 해요. 가족 코드로 연결된 가족도 같은 레시피북을 봐요.'),
        el('div', { class: 'book-link-row' }, input, save), err);
      return;
    }

    const data = bookData && bookData.url === url ? bookData.data : null;
    if (!data) {
      if (!canReadLinks()) {
        const go = el('button', { class: 'btn line', type: 'button' }, '로그인하기');
        go.addEventListener('click', () => { closeBook(); openAcct(); });
        bookBody.append(msg('레시피북을 읽으려면 오른쪽 위 사람 아이콘에서 구글로 로그인해 주세요.'), el('div', { class: 'acct-row' }, go));
      } else if (bookError) {
        const again = el('button', { class: 'btn line', type: 'button' }, '다시 읽기');
        again.addEventListener('click', () => refreshBook(true));
        bookBody.append(msg(bookError, 'err'), el('div', { class: 'acct-row' }, again));
      } else {
        bookBody.append(el('div', { class: 'shop-loading', role: 'status' }, el('span', { class: 'spinner' }), '레시피북을 읽고 있어요…'));
      }
      sub.textContent = '';
      return;
    }

    // All recipes, in the book's category order (categories not in the list go last).
    const recipes = data.books.flatMap((b) => b.recipes);
    const order = [...new Set([...data.books.flatMap((b) => b.categories), ...recipes.map((r) => r.category || '분류 없음')])]
      .filter((c) => recipes.some((r) => (r.category || '분류 없음') === c));
    sub.textContent = `${data.title || '레시피북'} · 레시피 ${recipes.length}개${bookLoading ? ' · 새로 읽는 중…' : ''}`;
    if (bookError) bookBody.append(msg(bookError + ' (전에 읽은 목록을 보여드려요)', 'warn'));

    const search = el('input', { type: 'search', class: 'book-search', id: 'book-q', placeholder: '레시피 검색', 'aria-label': '레시피 검색', autocomplete: 'off', enterkeyhint: 'search' });
    search.value = bookQuery;
    search.addEventListener('input', () => { bookQuery = search.value; filterBook(); });
    // 추천: the menus planned most often (book recipes and other menus alike), most frequent first.
    const hexOf = (u) => ((String(u || '').replace(/-/g, '').match(/[0-9a-f]{32}/i) || [])[0] || '').toLowerCase();
    const byHex = new Map(recipes.map((r) => [hexOf(r.url), r]));
    const byName = new Map(recipes.map((r) => [normName(r.title), r]));
    const favorites = [...menuLibrary().values()]
      .map((e) => ({ e, r: (hexOf(e.url) && byHex.get(hexOf(e.url))) || byName.get(normName(e.name)) || null }))
      .sort((a, b) => b.e.count - a.e.count || (a.e.last < b.e.last ? 1 : -1))
      .slice(0, 20);

    const cats = el('div', { class: 'book-cats', role: 'group', 'aria-label': '분류' });
    for (const c of ['all', 'rec', ...order]) {
      const n = c === 'all' ? recipes.length : c === 'rec' ? favorites.length : recipes.filter((r) => (r.category || '분류 없음') === c).length;
      const label = c === 'all' ? '전체' : c === 'rec' ? '추천' : c;
      const chip = el('button', { type: 'button', class: 'chip' + (bookCat === c ? ' on' : ''), 'data-cat': c }, label, el('small', null, String(n)));
      chip.addEventListener('click', () => {
        bookCat = c;
        cats.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x.dataset.cat === c));
        filterBook();
      });
      cats.append(chip);
    }
    bookBody.append(search, cats);

    // One row: the name (opens Notion or the menu's link), a meta line, and 식단에 넣기.
    const row = ({ title, href, metaParts, link, prefill }) => {
      const meta = el('span', { class: 'book-meta' });
      for (const part of metaParts) if (part) meta.append(el('span', null, part));
      if (link) meta.insertAdjacentHTML('beforeend', ICONS[platform(link)]);
      const main = href
        ? el('a', { class: 'book-main', href, target: '_blank', rel: 'noopener noreferrer', title: '열기' }, el('span', { class: 'book-name' }, title), meta)
        : el('span', { class: 'book-main' }, el('span', { class: 'book-name' }, title), meta);
      const add = el('button', { class: 'btn line', type: 'button' }, '식단에 넣기');
      add.addEventListener('click', () => {
        closeBook();
        openEditor(dateKey(new Date()), 'dinner', null, document.getElementById('book-open'), prefill);
      });
      return el('li', { class: 'book-row', 'data-find': normName(title) }, main, add);
    };
    const section = (cat, heading, ul) => el('section', { class: 'book-sec', 'data-cat': cat },
      el('h3', null, heading, el('small', null, String(ul.children.length))), ul);

    const list = el('div', { class: 'book-list' });
    const favUl = el('ul');
    for (const { e, r } of favorites) {
      const last = fromKey(e.last);
      favUl.append(row({
        title: e.name,
        href: (r && r.url) || e.url || '',
        metaParts: [`${e.count}번`, `마지막 ${last.getMonth() + 1}/${last.getDate()}`, r && r.time ? `${r.time}분` : '', r && r.level, e.kid ? '아이' : ''],
        link: r ? r.link : (e.url && !hexOf(e.url) ? e.url : ''),
        prefill: { text: e.name, url: e.url || (r && r.url) || '', kid: e.kid || (r ? isKidCategory(r.category) : false) },
      }));
    }
    list.append(section('rec', '자주 먹은 메뉴', favUl));
    for (const c of order) {
      const ul = el('ul');
      for (const r of recipes.filter((x) => (x.category || '분류 없음') === c)) {
        ul.append(row({
          title: r.title, href: r.url, metaParts: [r.time ? `${r.time}분` : '', r.level], link: r.link,
          prefill: { text: r.title, url: r.url, kid: isKidCategory(r.category) },
        }));
      }
      list.append(section(c, c, ul));
    }
    list.append(el('p', { class: 'shop-msg', id: 'book-none', hidden: true }, '찾는 레시피가 없어요.'));
    bookBody.append(list);
    filterBook();
  }
  // Sign-in finishing or the family's book link arriving while the book is open: draw it again.
  let lastBookState = '';
  function bookStateChanged() {
    const state = `${bookUrl()}|${canReadLinks()}`;
    if (state === lastBookState) return;
    lastBookState = state;
    if (bookOpen && !bookEditing) { renderBook(); refreshBook(); }
  }
  // Search and category filter in place, so typing Korean isn't interrupted by a redraw.
  function filterBook() {
    const q = normName(bookQuery);
    let shown = 0;
    for (const sec of bookBody.querySelectorAll('.book-sec')) {
      let n = 0;
      // 추천 shows only under its own chip (in 전체 it would repeat recipes)
      const catOk = sec.dataset.cat === 'rec' ? bookCat === 'rec' : bookCat === 'all' || sec.dataset.cat === bookCat;
      for (const li of sec.querySelectorAll('.book-row')) {
        const hit = catOk && (!q || li.dataset.find.includes(q));
        li.hidden = !hit;
        if (hit) n++;
      }
      sec.hidden = !n;
      sec.querySelector('h3 small').textContent = n;
      shown += n;
    }
    const none = bookBody.querySelector('#book-none');
    if (none) {
      none.hidden = shown > 0;
      none.textContent = bookCat === 'rec' && !q
        ? '아직 식단에 넣은 메뉴가 없어요. 식단에 넣을수록 자주 먹는 메뉴가 여기에 모여요.'
        : '찾는 레시피가 없어요.';
    }
  }

  /* ---------- reading 재료 from a link (shared by 남은 재료 and 모아서 장보기) ---------- */
  async function readLinkIngredients(url, token) {
    const r = await fetch(READER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ url }),
    });
    if (!r.ok) throw new Error('read ' + r.status);
    const data = await r.json();
    return { list: parseIngredients(data.text), kind: data.kind || '' };
  }
  // Runs jobs three at a time.
  async function inBatches(items, job) {
    const queue = [...items];
    await Promise.all([0, 1, 2].map(async () => { while (queue.length) await job(queue.shift()); }));
  }
  // Keeps 재료 on a menu's entry in the plan, where 메뉴 기억 and 🛒 find them.
  function rememberIngredients(key, name, list, kind, url) {
    const day = clone(days[key]);
    const target = MEALS.flatMap((m) => day[m.key] || []).reverse().find((x) => normName(x.text) === normName(name));
    if (!target) return;
    target.ing = { dish: '', src: true, kind: kind || '', list };
    if (!target.url && url) target.url = url;
    saveDay(key, day);
  }
  const triedLinks = new Set(); // links already read this visit without finding 재료

  // 레시피북 recipes' 재료, read once and kept on this device: { [notion page id]: { list, at } }.
  // A recipe without a 재료 list is tried again after a week.
  const notionId = (u) => ((String(u || '').replace(/-/g, '').match(/[0-9a-f]{32}/i) || [])[0] || '').toLowerCase();
  let bookIng = local.get('book-ing', {});
  const bookRecipes = () => (bookData && bookData.data ? bookData.data.books.flatMap((b) => b.recipes) : []);
  const bookIngFor = (r) => {
    const c = bookIng[notionId(r.url)];
    return c && c.list && c.list.length ? c.list : null;
  };

  /* ---------- 남은 재료로 뭐 먹지? ---------- */
  // Ranks remembered menus and 레시피북 recipes by how many of the 장보기 app's bought-and-not-used-up
  // items they use, counting items close to their 유통기한 more. Staples (salt, soy sauce, oil…) barely count.
  const STAPLES = new Set(['소금', '설탕', '흑설탕', '백설탕', '간장', '국간장', '진간장', '양조간장', '식용유', '올리브유',
    '포도씨유', '참기름', '들기름', '후추', '후춧가루', '깨', '통깨', '참깨', '물엿', '올리고당', '식초', '맛술', '미림',
    'msg', '다시다', '굴소스', '케첩', '마요네즈', '물', '고춧가루', '고추가루', '다진마늘', '깨소금'].map(normName));
  const isStaple = (n) => STAPLES.has(normName(n));
  const sameThing = (a, b) => {
    a = normName(a); b = normName(b);
    return a === b || (b.length >= 2 && a.includes(b)) || (a.length >= 2 && b.includes(a));
  };
  const urgency = (left) => (left === null ? 1 : left <= 2 ? 3 : left <= 5 ? 2 : 1);

  // Menus planned before, plus 레시피북 recipes not planned yet (with their 재료 once read).
  function recommendCandidates() {
    const lib = menuLibrary();
    const out = [...lib.values()];
    const planned = new Set([...lib.keys()]);
    for (const r of bookRecipes()) {
      if (planned.has(normName(r.title))) {
        // A planned menu that is also a book recipe: use the book's 재료 if the plan has none.
        const e = lib.get(normName(r.title));
        const list = bookIngFor(r);
        if (e && !e.ing && list) e.ing = { list };
        if (e) e.book = r;
        continue;
      }
      const list = bookIngFor(r);
      if (!list) continue;
      out.push({ name: r.title, url: r.url, ing: { list }, count: 0, last: '', meal: 'dinner', kid: isKidCategory(r.category), book: r });
    }
    return out;
  }
  function recommend(stock, candidates) {
    const out = [];
    for (const e of candidates) {
      const byName = !(e.ing && e.ing.list && e.ing.list.length);
      const names = byName ? [] : e.ing.list.map((x) => x.name);
      const used = stock.filter((s) => (byName
        ? normName(s.name).length >= 2 && normName(e.name).includes(normName(s.name))
        : names.some((n) => sameThing(n, s.name))));
      if (!used.some((s) => !isStaple(s.name))) continue;
      const score = used.reduce((t, s) => t + (isStaple(s.name) ? 0.2 : urgency(s.left)), 0);
      const missing = names.filter((n) => !isStaple(n) && !stock.some((s) => sameThing(n, s.name)));
      out.push({ e, used, score, missing, byName });
    }
    return out
      .sort((a, b) => b.score - a.score || a.missing.length - b.missing.length || b.e.count - a.e.count)
      .slice(0, 10);
  }

  const useup = document.getElementById('useup');
  const useupBody = document.getElementById('useup-body');
  let useupOpen = false, reading = 0, bookReading = 0, bookReadTotal = 0, stockExpanded = false;

  function openUseUp() {
    useupOpen = true;
    useup.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    renderUseUp();
    readMissingIngredients();
  }
  function closeUseUp() {
    useupOpen = false;
    useup.hidden = true;
    document.documentElement.style.overflow = '';
  }
  document.getElementById('useup-open').addEventListener('click', openUseUp);
  document.getElementById('useup-close').addEventListener('click', closeUseUp);
  useup.addEventListener('click', (e) => { if (e.target === useup) closeUseUp(); });

  // Reads 재료 that are still unknown: planned menus with a link, and every 레시피북 recipe (once).
  async function readMissingIngredients() {
    if (!canReadLinks() || reading > 0 || bookReading > 0) return;
    const menus = [...menuLibrary().values()].filter((e) => e.url && !e.ing && !triedLinks.has(e.url) && !notionId(e.url)).slice(0, 15);
    const weekAgo = Date.now() - 7 * 864e5;
    const recipes = bookRecipes().filter((r) => { const c = bookIng[notionId(r.url)]; return !c || (!(c.list && c.list.length) && c.at < weekAgo); });
    if (!menus.length && !recipes.length) return;
    let token;
    try { token = await window.cloud.idToken(); } catch { return; }
    reading = menus.length;
    bookReading = recipes.length; bookReadTotal = recipes.length;
    renderUseUp();
    let sinceDraw = 0;
    await inBatches([...menus.map((e) => ({ e })), ...recipes.map((r) => ({ r }))], async ({ e, r }) => {
      if (e) {
        triedLinks.add(e.url);
        try {
          const { list, kind } = await readLinkIngredients(e.url, token);
          if (list.length) rememberIngredients(e.last, e.name, list, kind, e.url);
        } catch (err) { console.warn('read', e.url, err); }
        reading--;
      } else {
        try {
          const { list } = await readLinkIngredients(r.url, token);
          bookIng[notionId(r.url)] = { list, at: Date.now() };
        } catch (err) { console.warn('read', r.url, err); }
        bookReading--;
        if (bookReading % 10 === 0) local.put('book-ing', bookIng);
      }
      if (useupOpen && ++sinceDraw >= 4) { sinceDraw = 0; renderUseUp(); }
    });
    local.put('book-ing', bookIng);
    reading = 0; bookReading = 0;
    if (useupOpen) renderUseUp();
  }

  function renderUseUp() {
    if (!useupOpen) return;
    const msg = (text, cls) => el('p', { class: 'shop-msg' + (cls ? ' ' + cls : '') }, text);
    useupBody.replaceChildren();
    if (!canAddToShopping()) {
      const go = el('button', { class: 'btn line', type: 'button' }, '로그인하기');
      go.addEventListener('click', () => { closeUseUp(); openAcct(); });
      useupBody.append(msg('장보기 앱의 남은 재료를 보려면 오른쪽 위 사람 아이콘에서 구글로 로그인해 주세요.'), el('div', { class: 'acct-row' }, go));
      return;
    }
    const today = new Date();
    const stock = window.cloud.stockItems()
      .map((s) => ({ name: String(s.name), left: s.expires ? daysBetween(today, fromKey(String(s.expires).slice(0, 10))) : null }))
      .sort((a, b) => (a.left === null) - (b.left === null) || (a.left ?? 0) - (b.left ?? 0));
    if (!stock.length) {
      useupBody.append(msg("장보기 앱의 '구입한 것' 목록이 비어 있어요. 장 본 재료를 '샀어요'로 옮기면 여기서 메뉴를 추천해 드려요."));
      return;
    }

    const leftText = (l) => (l === null ? '' : l < 0 ? '기한 지남' : l === 0 ? '오늘까지' : `${l}일`);
    // Two lines of chips (closest 유통기한 first); "모두 보기" opens the rest.
    const chips = el('div', { class: 'stock-chips' + (stockExpanded ? '' : ' clamp') });
    for (const s of stock) {
      chips.append(el('span', { class: 'chip' + (s.left !== null && s.left <= 2 ? ' soon' : '') }, s.name, s.left !== null ? el('small', null, leftText(s.left)) : null));
    }
    const more = el('button', { type: 'button', class: 'link-btn', hidden: true }, stockExpanded ? '접기' : `모두 보기 (${stock.length})`);
    more.addEventListener('click', () => { stockExpanded = !stockExpanded; renderUseUp(); });
    useupBody.append(el('div', { class: 'stock-head' }, el('span', { class: 'shop-msg' }, `남은 재료 ${stock.length}개`), more), chips);
    // Cut right under the second row of chips, measured, since chip height depends on the phone's font.
    requestAnimationFrame(() => {
      if (stockExpanded) { more.hidden = false; return; }
      const top = chips.getBoundingClientRect().top;
      const rowOf = (c) => Math.round(c.getBoundingClientRect().top - top);
      const rows = [...new Set([...chips.children].map(rowOf))].sort((a, b) => a - b);
      if (rows.length <= 2) { chips.style.maxHeight = 'none'; more.hidden = true; return; }
      const secondRow = [...chips.children].filter((c) => rowOf(c) === rows[1]);
      chips.style.maxHeight = Math.ceil(Math.max(...secondRow.map((c) => c.getBoundingClientRect().bottom)) - top + 1) + 'px';
      more.hidden = false;
    });

    if (reading > 0 || bookReading > 0) {
      const what = bookReading > 0
        ? `레시피북 레시피의 재료를 읽고 있어요… ${bookReadTotal - bookReading} / ${bookReadTotal} (처음 한 번만 걸려요)`
        : `메뉴 링크 ${reading}개에서 재료를 읽고 있어요…`;
      useupBody.append(el('div', { class: 'shop-loading', role: 'status' }, el('span', { class: 'spinner' }), what));
    }

    const recs = recommend(stock, recommendCandidates());
    if (!recs.length) {
      if (reading <= 0 && bookReading <= 0) {
        useupBody.append(msg(bookUrl()
          ? '남은 재료로 만들 만한 메뉴를 찾지 못했어요.'
          : '남은 재료로 만들 만한 메뉴를 찾지 못했어요. 📖 레시피북을 연결하면 레시피북 전체에서도 찾아 드려요.'));
      }
      return;
    }
    const ul = el('ul', { class: 'recs' });
    for (const r of recs) {
      const usedLine = el('span', { class: 'rec-line' }, '남은 재료: ');
      r.used.filter((s) => !isStaple(s.name)).forEach((s, i) => {
        if (i) usedLine.append(', ');
        usedLine.append(el('b', { class: s.left !== null && s.left <= 2 ? 'soon' : null }, s.name + (s.left !== null && s.left <= 5 ? ` (${leftText(s.left)})` : '')));
      });
      const second = r.byName
        ? el('span', { class: 'rec-line' }, '메뉴 이름으로 찾았어요')
        : el('span', { class: 'rec-line' }, r.missing.length ? `더 필요: ${r.missing.slice(0, 6).join(', ')}${r.missing.length > 6 ? ' 외' : ''}` : '재료가 다 있어요');
      const name = el('span', { class: 'rec-name' });
      if (r.e.url && !notionId(r.e.url)) name.insertAdjacentHTML('beforeend', ICONS[platform(r.e.url)]);
      name.append(r.e.name);
      if (r.e.book && !r.e.count) name.append(el('span', { class: 'book-tag' }, '레시피북'));
      else if (r.e.count) name.append(el('span', { class: 'book-tag plain' }, `${r.e.count}번 먹음`));
      const add = el('button', { class: 'btn primary', type: 'button' }, '식단에 넣기');
      add.addEventListener('click', () => {
        closeUseUp();
        openEditor(dateKey(new Date()), r.e.meal || 'dinner', null, document.getElementById('useup-open'), { text: r.e.name, url: r.e.url, kid: r.e.kid });
      });
      ul.append(el('li', { class: 'rec' }, el('div', { class: 'rec-main' }, name, usedLine, second), add));
    }
    useupBody.append(ul);
  }

  /* ---------- 모아서 장보기: 재료 of the menus on the days picked, merged into one list ---------- */
  // Menus whose 재료 went to the 장보기 app are marked "shopped" and left out next time.
  const gatherEl = document.getElementById('gather');
  const gatherBody = document.getElementById('gather-body');
  const gatherAdd = document.getElementById('gather-add');
  let gatherOpen = false, gatherDays = new Set(), gatherWithShopped = false, gatherReading = 0, gatherAdded = null;
  const gatherChoice = new Map(); // 재료 the person ticked or unticked themselves

  const menusOn = (keys) => keys.flatMap((k) => MEALS.flatMap((m) => ((days[k] || {})[m.key] || []).map((it) => ({ key: k, meal: m.key, it }))));
  function ingredientsOf(it, lib) {
    if (it.ing && it.ing.list && it.ing.list.length) return it.ing.list;
    const memo = lib.get(normName(it.text));
    if (memo && memo.ing && (!it.url || memo.url === it.url)) return memo.ing.list;
    const book = bookRecipes().find((r) => (it.url && notionId(it.url) && notionId(it.url) === notionId(r.url)) || normName(r.title) === normName(it.text));
    return book ? bookIngFor(book) : null;
  }
  const linkOf = (it, lib) => it.url || ((lib.get(normName(it.text)) || {}).url) || '';

  function openGather() {
    gatherOpen = true; gatherAdded = null; gatherWithShopped = false;
    gatherChoice.clear();
    // Start with the days from today on screen that still have menus not shopped for.
    const todayKey = dateKey(new Date());
    const shown = [...Array(7)].map((_, i) => dateKey(addDays(viewStart, i)));
    gatherDays = new Set(shown.filter((k) => k >= todayKey && menusOn([k]).some((m) => !m.it.shopped)));
    if (!gatherDays.size) gatherDays = new Set(shown.filter((k) => menusOn([k]).some((m) => !m.it.shopped)).slice(0, 1));
    gatherEl.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    renderGather();
    readGatherMissing();
  }
  function closeGather() {
    gatherOpen = false;
    gatherEl.hidden = true;
    document.documentElement.style.overflow = '';
  }
  document.getElementById('gather-open').addEventListener('click', openGather);
  document.getElementById('gather-close').addEventListener('click', closeGather);
  gatherEl.addEventListener('click', (e) => { if (e.target === gatherEl) closeGather(); });

  // Menus on the chosen days with a link but no 재료 yet: read them and remember the result.
  async function readGatherMissing() {
    if (!canReadLinks() || gatherReading > 0) return;
    const lib = menuLibrary();
    const todo = menusOn([...gatherDays]).filter(({ it }) => !ingredientsOf(it, lib) && linkOf(it, lib) && !triedLinks.has(linkOf(it, lib)));
    if (!todo.length) return;
    let token;
    try { token = await window.cloud.idToken(); } catch { return; }
    gatherReading = todo.length;
    renderGather();
    await inBatches(todo, async ({ key, it }) => {
      const url = linkOf(it, lib);
      triedLinks.add(url);
      try {
        const { list, kind } = await readLinkIngredients(url, token);
        if (list.length) rememberIngredients(key, it.text, list, kind, url);
      } catch (err) { console.warn('read', url, err); }
      gatherReading--;
      if (gatherOpen) renderGather();
    });
  }

  function gatherList() {
    const lib = menuLibrary();
    const menus = menusOn([...gatherDays].sort()).filter((m) => gatherWithShopped || !m.it.shopped);
    const merged = new Map(), known = [], unknown = [];
    for (const m of menus) {
      const list = ingredientsOf(m.it, lib);
      if (!list) { unknown.push(m); continue; }
      known.push(m);
      for (const g of list) {
        const k = normName(g.name);
        const e = merged.get(k) || { key: k, name: g.name, amounts: [], menus: [] };
        if (g.amount) e.amounts.push(g.amount);
        if (!e.menus.includes(m.it.text)) e.menus.push(m.it.text);
        merged.set(k, e);
      }
    }
    // Ticked unless already in the 장보기 list, still in 구입한 것, or a staple — the person can change it.
    const have = ownedNames();
    const stock = canAddToShopping() ? window.cloud.stockItems() : [];
    const items = [...merged.values()].map((e) => {
      const why = have.has(e.name.trim().toLowerCase()) ? '장보기 목록에 있어요'
        : stock.some((s) => sameThing(e.name, s.name)) ? '구입한 것에 있어요'
        : isStaple(e.name) ? '기본 양념' : '';
      return { ...e, why, on: gatherChoice.has(e.key) ? gatherChoice.get(e.key) : !why };
    });
    items.sort((a, b) => (!!a.why - !!b.why));
    const shoppedCount = menusOn([...gatherDays]).filter((m) => m.it.shopped).length;
    return { items, known, unknown, shoppedCount };
  }

  function renderGather() {
    if (!gatherOpen) return;
    const msg = (text, cls) => el('p', { class: 'shop-msg' + (cls ? ' ' + cls : '') }, text);
    gatherBody.replaceChildren();
    gatherAdd.hidden = true;

    if (gatherAdded !== null) {
      gatherBody.append(msg(gatherAdded
        ? `장보기 앱의 슈퍼마켓 목록에 ${gatherAdded}개를 넣었어요. 넣은 메뉴는 '장 봤어요'로 표시해 뒀어요.`
        : '고른 재료가 이미 장보기 목록에 모두 있어요.'));
      return;
    }

    // Days on screen to choose from
    const pick = el('div', { class: 'day-pick' });
    [...Array(7)].forEach((_, i) => {
      const d = addDays(viewStart, i), k = dateKey(d);
      const n = menusOn([k]).length;
      const box = el('input', { type: 'checkbox', id: 'g-day-' + i, value: k });
      box.checked = gatherDays.has(k);
      box.addEventListener('change', () => {
        if (box.checked) gatherDays.add(k); else gatherDays.delete(k);
        renderGather();
        readGatherMissing();
      });
      pick.append(box, el('label', { for: 'g-day-' + i, class: [dowClass(d), n ? null : 'empty-day'].filter(Boolean).join(' ') || null },
        el('b', null, dowName(d)), el('span', null, String(d.getDate())), el('small', null, n ? `${n}개` : '–')));
    });
    gatherBody.append(el('div', { class: 'day-pick-head' }, el('span', null, '장 볼 날짜', el('small', null, '메뉴가 있는 날을 골라요'))), pick);

    if (!gatherDays.size) { gatherBody.append(msg('장 볼 날짜를 골라 주세요.')); return; }
    const { items, known, unknown, shoppedCount } = gatherList();

    if (shoppedCount) {
      const box = el('input', { type: 'checkbox', id: 'g-shopped' });
      box.checked = gatherWithShopped;
      box.addEventListener('change', () => { gatherWithShopped = box.checked; renderGather(); readGatherMissing(); });
      gatherBody.append(el('label', { class: 'g-toggle', for: 'g-shopped' }, box, `이미 장 본 메뉴 ${shoppedCount}개도 넣기`));
    }
    if (gatherReading > 0) {
      gatherBody.append(el('div', { class: 'shop-loading', role: 'status' }, el('span', { class: 'spinner' }), `메뉴 링크 ${gatherReading}개에서 재료를 읽고 있어요…`));
    }
    if (known.length) gatherBody.append(msg(`메뉴 ${known.length}개의 재료예요: ${known.map((m) => (m.it.kid ? '아이 ' : '') + m.it.text).join(', ')}`));
    if (unknown.length && gatherReading <= 0) {
      gatherBody.append(msg(`재료를 모르는 메뉴: ${unknown.map((m) => m.it.text).join(', ')}. 메뉴의 🛒에서 글이나 사진으로 재료를 넣으면 여기에도 들어가요.`, 'warn'));
    }
    if (!items.length) {
      if (!known.length && !unknown.length) gatherBody.append(msg('고른 날짜에 장 볼 메뉴가 없어요.'));
      return;
    }

    const ul = el('ul', { class: 'ing-list' });
    items.forEach((it, i) => {
      const box = el('input', { type: 'checkbox', id: 'g-ing-' + i });
      box.checked = it.on;
      box.addEventListener('change', () => { gatherChoice.set(it.key, box.checked); it.on = box.checked; updateGatherCount(items); });
      ul.append(el('li', { class: it.why ? 'have' : null },
        el('label', { for: 'g-ing-' + i }, box,
          el('span', { class: 'g-ing' },
            el('span', { class: 'ing-name' }, it.name, it.why ? el('span', { class: 'ing-have' }, '· ' + it.why) : null),
            el('small', { class: 'g-for' }, it.menus.join(', '))),
          it.amounts.length ? el('span', { class: 'ing-amount' }, it.amounts.join(' + ')) : null)));
    });
    gatherBody.append(ul);

    if (!canAddToShopping()) {
      const go = el('button', { class: 'btn line', type: 'button' }, '로그인하기');
      go.addEventListener('click', () => { closeGather(); openAcct(); });
      gatherBody.append(msg('장보기 앱에 넣으려면 오른쪽 위 사람 아이콘에서 구글로 로그인해 주세요.'), el('div', { class: 'acct-row' }, go));
      return;
    }
    gatherAdd.hidden = false;
    gatherAdd.onclick = () => {
      const picks = items.filter((x) => x.on);
      if (!picks.length) return;
      const note = (e) => {
        const menus = e.menus.length > 2 ? `${e.menus.slice(0, 2).join('·')} 외 ${e.menus.length - 2}` : e.menus.join('·');
        return [menus, e.amounts.join('+')].filter(Boolean).join(' · ');
      };
      gatherAdded = window.cloud.addToShopping(picks.map((e) => ({ name: e.name, note: note(e) })));
      // Mark the menus whose 재료 were gathered as shopped.
      const byDay = new Map();
      for (const m of known) { if (!byDay.has(m.key)) byDay.set(m.key, new Set()); byDay.get(m.key).add(m.it.id); }
      for (const [key, ids] of byDay) {
        const day = clone(days[key]);
        for (const mm of MEALS) for (const x of day[mm.key] || []) if (ids.has(x.id)) x.shopped = true;
        saveDay(key, day);
      }
      renderGather();
    };
    updateGatherCount(items);
  }
  function updateGatherCount(items) {
    const n = items.filter((x) => x.on).length;
    gatherAdd.textContent = n ? `슈퍼마켓에 ${n}개 넣기` : '슈퍼마켓에 넣기';
    gatherAdd.disabled = !n;
  }


  /* ---------- 함께 보기 (account) ---------- */
  const acct = document.getElementById('acct');
  const acctBody = document.getElementById('acct-body');
  function openAcct() { acct.hidden = false; document.documentElement.style.overflow = 'hidden'; renderAccount(); }
  function closeAcct() { acct.hidden = true; document.documentElement.style.overflow = ''; }
  document.getElementById('acct-open').addEventListener('click', openAcct);
  statusEl.addEventListener('click', openAcct);
  document.getElementById('acct-close').addEventListener('click', closeAcct);
  acct.addEventListener('click', (e) => { if (e.target === acct) closeAcct(); });

  function renderAccount() {
    const c = window.cloud;
    document.getElementById('acct-dot').hidden = !(c && c.live);
    if (c && c.error) setStatus('error', c.error);
    else if (c && c.live) setStatus('synced', '가족과 함께 보는 중');
    else if (c && c.user && c.ready) setStatus('local', '가족 코드를 연결하면 함께 볼 수 있어요');
    else setStatus('local', '이 기기에만 저장돼요 · 함께 보기');
    if (acct.hidden) return;

    const btn = (act, cls, label) => el('button', { class: 'btn ' + cls, type: 'button', 'data-acct': act }, label);
    acctBody.replaceChildren();
    if (!c || !c.ready) {
      acctBody.append(el('p', null, window.FIREBASE_CONFIG ? '연결을 준비하고 있어요…' : '이 버전에서는 함께 보기를 쓸 수 없어요.'));
    } else if (c.unavailable) {
      acctBody.append(el('p', null, '인터넷에 연결되면 함께 보기를 쓸 수 있어요. 식단은 이 기기에 그대로 저장돼요.'));
    } else if (!c.user) {
      acctBody.append(
        el('p', null, '구글로 로그인하면 휴대폰, 컴퓨터, 가족이 같은 식단을 봐요. 장보기 앱에서 쓰는 계정으로 로그인하면 같은 가족과 바로 연결돼요.'),
        el('div', { class: 'acct-row' }, btn('signin', 'primary', '구글로 로그인')));
    } else {
      acctBody.append(el('p', null, '로그인: ', el('span', { class: 'who' }, c.user.email || c.user.displayName || '')));
      if (!c.house) {
        acctBody.append(
          el('p', null, '장보기 앱의 가족 코드를 넣거나, 새 코드를 만드세요.'),
          el('div', { class: 'acct-row' },
            el('input', { id: 'acct-code', placeholder: '가족 코드', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', 'aria-label': '가족 코드' }),
            btn('join', 'primary', '연결')),
          el('div', { class: 'acct-row' }, btn('create', 'line', '새 가족 코드 만들기')));
      } else {
        acctBody.append(
          el('p', null, '가족 코드 · 가족이 이 코드로 연결하면 같은 식단을 봐요.'),
          el('div', { class: 'acct-row' }, el('span', { class: 'code' }, c.house), btn('copy', 'line', '복사')));
      }
      acctBody.append(el('div', { class: 'acct-row' }, btn('signout', 'ghost', '로그아웃')));
    }
    if (c && c.note) acctBody.append(el('p', { class: 'hint err' }, c.note));
  }

  acctBody.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-acct]');
    const c = window.cloud;
    if (!b || !c) return;
    const act = b.dataset.acct;
    c.note = '';
    if (act === 'copy') {
      try { await navigator.clipboard.writeText(c.house); b.textContent = '복사됨'; }
      catch { const r = document.createRange(); r.selectNodeContents(acctBody.querySelector('.code')); getSelection().removeAllRanges(); getSelection().addRange(r); }
      return;
    }
    b.disabled = true;
    try {
      if (act === 'signin') await c.signIn();
      else if (act === 'signout') await c.signOut();
      else if (act === 'create') await c.create();
      else if (act === 'join') {
        const ok = await c.join(document.getElementById('acct-code').value);
        if (!ok) c.note = '그 코드를 찾을 수 없어요. 다시 확인해 주세요';
      }
    } catch (err) {
      console.warn(err);
      if (!(err && /popup-closed|cancelled-popup/.test(err.code || '')))
        c.note = act === 'signin' ? '로그인하지 못했어요. 다시 시도해 주세요' : '연결하지 못했어요. 인터넷 연결을 확인해 주세요';
    }
    b.disabled = false;
    renderAccount();
  });

  board.addEventListener('click', (e) => {
    const shopBtn = e.target.closest('[data-shop]');
    if (shopBtn) { openShop(shopBtn.dataset.key, shopBtn.dataset.meal, shopBtn.dataset.shop, shopBtn); return; }
    const editBtn = e.target.closest('[data-edit]');
    if (editBtn) { openEditor(editBtn.dataset.key, editBtn.dataset.meal, editBtn.dataset.edit, editBtn); return; }
    if (e.target.closest('a')) return; // link opens in a new tab
    const slot = e.target.closest('.slot');
    if (slot) openEditor(slot.dataset.key, slot.dataset.meal, null, slot.querySelector('.add'));
  });

  /* ---------- week nav ---------- */
  document.getElementById('prev').addEventListener('click', () => { viewStart = addDays(viewStart, -7); render(); });
  document.getElementById('next').addEventListener('click', () => { viewStart = addDays(viewStart, 7); render(); });
  document.getElementById('today').addEventListener('click', () => { viewStart = startOfDay(new Date()); render(); });

  // Opening the app on a new day (it may have stayed open in the background) moves the view to today.
  let lastToday = dateKey(new Date());
  function followToday() {
    const now = dateKey(new Date());
    if (now === lastToday) return;
    if (dateKey(viewStart) === lastToday) viewStart = startOfDay(new Date());
    lastToday = now;
    render();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) followToday(); });
  setInterval(followToday, 60 * 1000);

  render();
  renderAccount();
  // 오프라인 기능 + 새 버전 바로 적용: sw.js 는 저장본을 쓰지 않음, 앱으로 돌아올 때 새 버전 확인,
  // 새 버전이 자리 잡으면 한 번 새로 고침.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }
})();
</script>
<script src="firebase-config.js"></script>
<script type="module">
// ---------- 함께 보기 (Firebase) ----------
// Same Firebase project and household as the 장보기 app: households/{가족 코드}.
// The meal plan lives in that document's `meals` field as meals.{YYYY-MM-DD} = { lunch, dinner, other };
// the 장보기 app never touches that field. Each change uploads one day, so two phones don't overwrite each other's days.
const cfg = window.FIREBASE_CONFIG, M = window.meals;
if (cfg && M) {
  const cloud = window.cloud = { ready: false, user: null, house: null, live: false, error: '', note: '' };
  M.refresh();
  let A, F, initializeApp;
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
    [{ initializeApp }, A, F] = await Promise.all(
      [import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  } catch (e) {
    console.warn('firebase', e);
    cloud.ready = true; cloud.unavailable = true; M.refresh();
  }
  if (A) {
    const fb = initializeApp(cfg), auth = A.getAuth(fb);
    const db = F.initializeFirestore(fb, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
    const house = () => F.doc(db, 'households', cloud.house);
    const field = (k) => new F.FieldPath('meals', k);
    let unsub = null;

    const fail = (e) => { console.warn('sync', e); cloud.error = '서버에 저장하지 못했어요. 인터넷 연결을 확인해 주세요'; M.refresh(); };
    const ok = () => { if (cloud.error) { cloud.error = ''; M.refresh(); } };

    function stop() { if (unsub) unsub(); unsub = null; cloud.live = false; }
    // Earlier versions wrote "메뉴 이름 · 양" into the 장보기 memo. Take the menu's name out again, keep the amount.
    function dropMenuNames(meals) {
      const menus = new Set(), args = [];
      for (const day of Object.values(meals)) for (const list of Object.values(day || {})) {
        if (Array.isArray(list)) for (const it of list) if (it && it.text) menus.add(it.text);
      }
      for (const [kind, all] of [['items', shopItems], ['stock', stockItems]]) for (const x of Object.values(all)) {
        if (!x || !x.id || !x.note) continue;
        const menu = [...menus].find((m) => x.note === m || x.note.startsWith(m + ' · '));
        if (!menu) continue;
        const rest = x.note.slice(menu.length + 3);
        args.push(new F.FieldPath(kind, x.id, 'note'), rest || F.deleteField());
      }
      if (args.length) F.updateDoc(house(), ...args).then(ok, fail);
    }
    function listen() {
      stop();
      let first = true;
      unsub = F.onSnapshot(house(), (snap) => {
        if (!snap.exists()) return;
        shopItems = snap.data().items || {};
        stockItems = snap.data().stock || {};
        cloud.recipeBook = snap.data().recipeBook || ''; // 레시피북 link, shared with the family
        const remote = JSON.parse(JSON.stringify(snap.data().meals || {}));
        if (first) {
          first = false;
          // First contact with this household on this device: add the days only this device has.
          // Afterwards: send only the days changed while not connected.
          const mine = M.days(), firstTime = M.syncedHouse() !== cloud.house, args = [];
          for (const k of Object.keys(mine)) {
            if ((firstTime && !remote[k]) || M.unsynced.has(k)) { args.push(field(k), mine[k]); remote[k] = mine[k]; }
          }
          for (const k of M.unsynced) if (!mine[k] && remote[k]) { args.push(field(k), F.deleteField()); delete remote[k]; }
          M.clearUnsynced();
          M.setSyncedHouse(cloud.house);
          if (args.length) F.updateDoc(house(), ...args).then(ok, fail);
          cloud.live = true;
        }
        M.setDays(remote);
        M.refresh();
        dropMenuNames(remote);
      }, (e) => { stop(); fail(e); });
    }
    async function link(code) {
      cloud.house = code;
      await F.setDoc(F.doc(db, 'users', auth.currentUser.uid), { house: code });
      listen();
    }

    cloud.push = (k, v) => F.updateDoc(house(), field(k), v === null ? F.deleteField() : v).then(ok, fail);

    // 장보기 app: things still to buy live in items.{id} = { id, store, name, note }; 'super' is the 슈퍼마켓 list.
    let shopItems = {}, stockItems = {};
    // 구입한 것: bought and not yet used up, { id, name, expires: 'YYYY-MM-DD' | null, loc, … }
    cloud.stockItems = () => Object.values(stockItems).filter((x) => x && x.name);
    const nameKey = (s) => String(s || '').trim().toLowerCase();
    cloud.idToken = () => auth.currentUser.getIdToken();
    cloud.setRecipeBook = (url) => F.updateDoc(house(), { recipeBook: url }).then(ok, fail);
    cloud.shoppingNames = () => new Set(Object.values(shopItems).filter((x) => x && x.store === 'super').map((x) => nameKey(x.name)));
    cloud.addToShopping = (entries) => {
      const have = cloud.shoppingNames(), args = [];
      for (const e of entries) {
        const k = nameKey(e.name);
        if (!k || have.has(k)) continue;
        have.add(k);
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        args.push(new F.FieldPath('items', id), { id, store: 'super', name: e.name.trim(), ...(e.note && { note: e.note }) });
      }
      if (args.length) F.updateDoc(house(), ...args).then(ok, fail);
      return args.length / 2;
    };
    cloud.signIn = () => A.signInWithPopup(auth, new A.GoogleAuthProvider());
    cloud.signOut = async () => { stop(); cloud.house = null; await A.signOut(auth); };
    cloud.create = async () => {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = [...crypto.getRandomValues(new Uint8Array(10))].map((n) => abc[n % abc.length]).join('');
      await F.setDoc(F.doc(db, 'households', code), { stores: {}, items: {}, stock: {}, meals: {}, created: Date.now() });
      await link(code);
    };
    cloud.join = async (raw) => {
      const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!code || !(await F.getDoc(F.doc(db, 'households', code))).exists()) return false;
      await link(code);
      return true;
    };

    A.onAuthStateChanged(auth, async (user) => {
      cloud.user = user;
      if (!user) { stop(); cloud.house = null; }
      else if (!cloud.house) {
        try {
          const u = await F.getDoc(F.doc(db, 'users', user.uid));
          if (u.exists() && u.data().house) cloud.house = u.data().house;
        } catch (e) { console.warn('sync', e); }
        if (cloud.house) listen();
      }
      cloud.ready = true;
      M.refresh();
    });
  }
}
</script>
