<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC61A">
<meta name="apple-mobile-web-app-title" content="주간식단">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>주간식단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
/* Layout: a yolk-yellow header band over a week grid — meal rows (점심·저녁·기타) × 7 day columns; on phones each day becomes a card with its three meals side by side. */
:root {
  --bg: #FFF5C7;
  --surface: #FFFDF3;
  --yolk: #FFC61A;
  --yolk-strong: #E9A400;
  --yolk-soft: #FFEB99;
  --ink: #2A2413;
  --muted: #7B6A3E;
  --line: #F0DB8C;
  --on-yolk: #2A2413;
  --on-brand: #FFFFFF;
  --sat: #2F6AD0;
  --sun: #D23F3F;
  --yt: #E1302A;
  --ig: #C2338A;
  --link: #6E5C2A;
  --danger: #C23A2E;
  --bowl: #D9481F;
  --rice: #FFFFFF;
  --rice-dot: #EADFC0;
  --scrim: rgba(42, 36, 19, .38);
  --shadow: 0 1px 0 rgba(130, 95, 0, .06), 0 6px 18px -10px rgba(130, 95, 0, .35);
  --font-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16130B; --surface: #221E12; --yolk: #FFC93A; --yolk-strong: #FFD460; --yolk-soft: #3B3114;
    --ink: #F7EFD5; --muted: #BDAE83; --line: #3A3320; --on-yolk: #2A2413; --on-brand: #FFFFFF;
    --sat: #84ACF4; --sun: #F38D8D; --yt: #FF5C54; --ig: #EC7ABD; --link: #D9C78F; --danger: #FF8A7E;
    --bowl: #E8562C; --rice: #FFFDF3; --rice-dot: #D9CDA8;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 6px 18px -10px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16130B; --surface: #221E12; --yolk: #FFC93A; --yolk-strong: #FFD460; --yolk-soft: #3B3114;
  --ink: #F7EFD5; --muted: #BDAE83; --line: #3A3320; --on-yolk: #2A2413; --on-brand: #FFFFFF;
  --sat: #84ACF4; --sun: #F38D8D; --yt: #FF5C54; --ig: #EC7ABD; --link: #D9C78F; --danger: #FF8A7E;
  --bowl: #E8562C; --rice: #FFFDF3; --rice-dot: #D9CDA8;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 6px 18px -10px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--yolk);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yolk-strong); outline-offset: 2px; border-radius: 6px; }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--yolk); color: var(--on-yolk);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-inner {
  max-width: 1320px; margin: 0 auto; padding-block: 12px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: -.01em; line-height: 1; }
.logo { width: 38px; height: 38px; flex: none; }
.weeknav { display: flex; align-items: center; gap: 6px; }
.navbtn {
  width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: rgba(42, 36, 19, .1); color: var(--on-yolk);
  display: grid; place-items: center;
}
.navbtn:hover { background: rgba(42, 36, 19, .18); }
.navbtn svg { width: 18px; height: 18px; }
.range { display: flex; flex-direction: column; align-items: center; min-width: 150px; padding-inline: 4px; }
.range strong { font-family: var(--font-display); font-weight: 400; font-size: 19px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.range small { font-size: 12px; opacity: .72; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.today-btn {
  margin-left: 4px; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--on-yolk);
  background: transparent; color: var(--on-yolk); font-weight: 600;
}
.today-btn:hover { background: var(--on-yolk); color: var(--yolk); }
.today-btn[disabled] { opacity: .35; pointer-events: none; }

/* ---------- board ---------- */
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
.board {
  display: grid;
  grid-template-columns: 58px repeat(7, minmax(0, 1fr));
  grid-template-rows: auto repeat(3, minmax(120px, auto));
  gap: 8px;
}
.labels, .day { grid-row: 1 / span 4; display: grid; grid-template-rows: subgrid; }
.labels { color: var(--muted); }
.row-label {
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  padding-left: 2px;
}
.row-label span { font-family: var(--font-display); font-size: 18px; color: var(--ink); line-height: 1.1; }
.row-label small { font-size: 11px; line-height: 1.3; }

.day-head {
  display: flex; align-items: baseline; gap: 6px;
  padding: 6px 8px 4px; border-radius: 10px;
}
.dow { font-weight: 600; font-size: 13px; }
.dow.sat { color: var(--sat); }
.dow.sun { color: var(--sun); }
.dnum { font-family: var(--font-display); font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.today-tag {
  margin-left: auto; align-self: center; font-size: 11px; font-weight: 600; letter-spacing: .04em;
  background: var(--ink); color: var(--bg); padding: 1px 8px; border-radius: 999px;
}
.day.is-today .day-head { background: var(--yolk); color: var(--on-yolk); }
.day.is-today .day-head .dow { color: var(--on-yolk); }
.day.is-today .today-tag { background: var(--on-yolk); color: var(--yolk); }

.slot {
  position: relative; min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 6px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
.slot:hover { border-color: var(--yolk-strong); box-shadow: var(--shadow); }
.day.is-today .slot { border-color: var(--yolk); border-width: 2px; padding: 5px; }
.slot-label { display: none; font-size: 12px; font-weight: 500; color: var(--muted); padding: 0 4px; letter-spacing: .02em; }

.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.item { display: flex; align-items: flex-start; gap: 2px; min-width: 0; }
.item-main {
  flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 5px;
  padding: 4px 6px; border-radius: 8px; border: 0; background: none;
  color: var(--ink); text-decoration: none; text-align: left; line-height: 1.3;
  font-size: 16px; font-weight: 600; letter-spacing: -.01em;
  word-break: keep-all; overflow-wrap: anywhere;
}
.item-main:hover { background: var(--yolk-soft); }
a.item-main .txt {
  text-decoration: underline; text-decoration-thickness: 2px;
  text-decoration-color: var(--yolk-strong); text-underline-offset: 3px;
}
.ico { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.item { position: relative; }
.item-tools { flex: none; display: flex; gap: 2px; }
.item-tools button {
  width: 28px; height: 28px; border: 0; border-radius: 7px; background: none;
  color: var(--muted); display: grid; place-items: center;
}
.item-tools svg { width: 15px; height: 15px; }
.item-tools button:hover { background: var(--yolk-soft); color: var(--ink); }
.item-tools .item-cart { color: var(--yolk-strong); }
/* Wide screens with a mouse: the tools float over the name on hover, so narrow day columns keep the full name. */
@media (hover: hover) and (min-width: 901px) {
  .item-tools {
    position: absolute; right: 0; top: 0; padding: 2px; border-radius: 9px;
    background: var(--surface); box-shadow: var(--shadow); opacity: 0; pointer-events: none;
  }
  .item:hover .item-tools, .item-tools:focus-within { opacity: 1; pointer-events: auto; }
}

/* Tapping anywhere in a meal box adds a menu; this button stays only for keyboards and screen readers. */
.add {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
.slot:has(.add:focus-visible) { outline: 3px solid var(--yolk-strong); outline-offset: 2px; }

/* ---------- menu memory chips, 남은 재료 ---------- */
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 999px; padding: 5px 11px; font-size: 14px; font-weight: 500;
}
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--yolk-strong); background: var(--yolk-soft); }
.chip .ico { margin-top: 0; width: 14px; height: 14px; }
.chip small { color: var(--muted); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.chip.soon { border-color: var(--danger); }
.chip.soon small { color: var(--danger); font-weight: 600; }
.tools-bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
.useup-btn { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); }
.useup-btn svg { width: 16px; height: 16px; color: var(--yolk-strong); }
.stock-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.recs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rec { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
.rec-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rec-name { font-weight: 600; font-size: 16px; display: flex; gap: 6px; align-items: center; }
.rec-line { font-size: 13px; color: var(--muted); line-height: 1.45; }
.rec-line b { color: var(--ink); font-weight: 600; }
.rec-line b.soon { color: var(--danger); }
.rec .btn { flex: none; height: 36px; padding: 0 12px; font-size: 13.5px; }
@media (max-width: 900px) { .tools-bar { justify-content: stretch; } .useup-btn { width: 100%; justify-content: center; } }

/* ---------- 장보기 sheet ---------- */
.shop-body { display: flex; flex-direction: column; gap: 12px; max-height: min(58vh, 520px); overflow-y: auto; }
.shop-msg { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.55; }
.shop-msg.warn { background: var(--yolk-soft); color: var(--ink); padding: 10px 12px; border-radius: 10px; }
.shop-msg.err { color: var(--danger); }
.shop-loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 18px 0; }
.spinner {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  border: 3px solid var(--yolk-soft); border-top-color: var(--yolk-strong); animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ing-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ing-list li { border-bottom: 1px solid var(--line); }
.ing-list li:last-child { border-bottom: 0; }
.ing-list label { display: flex; align-items: center; gap: 10px; padding: 9px 2px; cursor: pointer; }
.ing-list input { width: 20px; height: 20px; accent-color: var(--yolk-strong); flex: none; }
.ing-name { font-weight: 600; font-size: 15.5px; }
.ing-amount { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
.ing-have { color: var(--muted); font-size: 12px; margin-left: 4px; }
.ing-list li.have .ing-name { color: var(--muted); }
.paste { display: flex; flex-direction: column; gap: 8px; }
.paste summary { cursor: pointer; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.paste textarea {
  width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 15px;
}

.foot {
  margin-top: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px;
  color: var(--muted); font-size: 13px;
}
.foot strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.status {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: none;
  color: var(--muted); font-size: 13px; padding: 4px 0; text-decoration: underline;
  text-decoration-color: var(--line); text-underline-offset: 3px;
}
.status:hover { color: var(--ink); }
.acct-btn { position: relative; margin-left: 2px; }
.acct-dot {
  position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%;
  background: #3BA55C; box-shadow: 0 0 0 2px var(--yolk);
}
.acct-body { display: flex; flex-direction: column; gap: 12px; }
.acct-body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
.acct-body .who { color: var(--ink); font-weight: 600; }
.acct-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.acct-row input {
  flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px; letter-spacing: .08em;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font-size: 16px; text-transform: uppercase;
}
.code {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 17px; letter-spacing: .12em;
  background: var(--yolk-soft); padding: 8px 12px; border-radius: 10px; user-select: all;
}
.btn.line { background: none; border: 1.5px solid var(--line); color: var(--ink); }
.btn.line:hover { border-color: var(--yolk-strong); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-state="synced"]::before { background: #3BA55C; }
.status[data-state="local"]::before { background: var(--yolk-strong); }
.status[data-state="error"]::before, .status[data-state="slow"]::before { background: var(--danger); }
.legend { display: inline-flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.legend span { display: inline-flex; gap: 4px; align-items: center; }

/* ---------- phone layout ---------- */
@media (max-width: 900px) {
  .board { display: flex; flex-direction: column; gap: 14px; }
  .labels { display: none; }
  /* Phone: each day is a card, one full-width row per meal, so menu names get the whole width. */
  .day { display: flex; flex-direction: column; gap: 6px; }
  .day-head { padding: 6px 10px; }
  .slot { flex-direction: row; align-items: flex-start; gap: 6px; min-height: 50px; padding: 8px 6px 8px 10px; }
  .day.is-today .slot { padding: 7px 5px 7px 9px; }
  .slot-label { display: block; flex: none; width: 30px; padding: 4px 0 0; }
  .items { flex: 1; min-width: 0; }
  .range { min-width: 0; }
}

/* ---------- editor sheet ---------- */
.backdrop {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  width: min(440px, 100%); background: var(--surface); color: var(--ink);
  border-radius: 20px; padding: 20px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 14px;
  animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translateY(12px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.meal-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.meal-pick input, .day-pick input { position: absolute; opacity: 0; pointer-events: none; }
.day-pick-wrap { display: flex; flex-direction: column; gap: 6px; }
.day-pick-head { display: flex; justify-content: space-between; align-items: center; }
.day-pick-head > span { font-size: 13px; font-weight: 600; }
.day-pick-head small { font-weight: 400; color: var(--muted); margin-left: 4px; font-size: 12px; }
.chip-link {
  border: 0; background: var(--yolk-soft); color: var(--ink); font-size: 12.5px; font-weight: 600;
  padding: 4px 10px; border-radius: 999px;
}
.chip-link:hover { background: var(--yolk); color: var(--on-yolk); }
.day-pick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.day-pick label {
  display: flex; flex-direction: column; align-items: center; gap: 0;
  padding: 6px 0 5px; border-radius: 10px; border: 1.5px solid var(--line); cursor: pointer;
  color: var(--muted); line-height: 1.2; user-select: none;
}
.day-pick label b { font-weight: 600; font-size: 13px; }
.day-pick label span { font-family: var(--font-display); font-size: 16px; font-variant-numeric: tabular-nums; }
.day-pick label.sat b { color: var(--sat); }
.day-pick label.sun b { color: var(--sun); }
.day-pick input:checked + label { background: var(--yolk); border-color: var(--yolk); color: var(--on-yolk); }
.day-pick input:checked + label b { color: var(--on-yolk); }
.day-pick input:focus-visible + label { outline: 3px solid var(--yolk-strong); outline-offset: 2px; }
.meal-pick label {
  text-align: center; padding: 8px 0; border-radius: 10px; border: 1.5px solid var(--line);
  font-family: var(--font-display); font-size: 16px; cursor: pointer; color: var(--muted);
}
.meal-pick input:checked + label { background: var(--yolk); border-color: var(--yolk); color: var(--on-yolk); }
.meal-pick input:focus-visible + label { outline: 3px solid var(--yolk-strong); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 13px; font-weight: 600; }
.field em { font-style: normal; font-weight: 400; color: var(--muted); margin-left: 4px; }
.field input {
  width: 100%; height: 44px; padding: 0 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font-size: 16px;
}
.field input:focus { outline: none; border-color: var(--yolk-strong); box-shadow: 0 0 0 3px color-mix(in srgb, var(--yolk) 45%, transparent); }
.hint { margin: -6px 0 0; min-height: 1.4em; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.hint.err { color: var(--danger); }
.sheet-actions { display: flex; gap: 8px; align-items: center; }
.sheet-actions .spacer { flex: 1; }
.btn { height: 42px; padding: 0 18px; border-radius: 999px; border: 0; font-weight: 600; }
.btn.primary { background: var(--yolk); color: var(--on-yolk); }
.btn.primary:hover { background: var(--yolk-strong); }
.btn.ghost { background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--yolk-soft); }
.btn.danger { background: none; color: var(--danger); padding: 0 10px; }
.btn.danger.armed { background: var(--danger); color: var(--surface); padding: 0 14px; }
@media (max-width: 600px) {
  .backdrop { align-items: flex-end; padding: 0; }
  .sheet {
    width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px max(18px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  }
}
@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .slot { transition: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="var(--surface)"/>
        <path d="M27.5 6.5 19 17.5M31.5 8.5 21.5 18" stroke="var(--link)" stroke-width="2" stroke-linecap="round"/>
        <path d="M8.5 19.5c2-3.6 5.8-5.5 11.5-5.5s9.5 1.9 11.5 5.5z" fill="var(--rice)"/>
        <circle cx="14" cy="17.6" r="1" fill="var(--rice-dot)"/><circle cx="19" cy="16.2" r="1" fill="var(--rice-dot)"/><circle cx="24.5" cy="17.4" r="1" fill="var(--rice-dot)"/>
        <path d="M7 19.5h26c0 6.6-5.4 11.5-13 11.5S7 26.1 7 19.5z" fill="var(--bowl)"/>
        <path d="M10 23.5h20" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
        <rect x="15" y="30.5" width="10" height="2.6" rx="1.3" fill="var(--bowl)"/>
      </svg>
      <h1>주간식단</h1>
    </div>
    <nav class="weeknav" aria-label="주 이동">
      <button class="navbtn" id="prev" type="button" aria-label="이전 7일">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
      </button>
      <div class="range" aria-live="polite">
        <strong id="range-label"></strong>
        <small id="range-sub"></small>
      </div>
      <button class="navbtn" id="next" type="button" aria-label="다음 7일">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>
      </button>
      <button class="today-btn" id="today" type="button">오늘</button>
      <button class="navbtn acct-btn" id="acct-open" type="button" aria-label="함께 보기 설정">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="10" cy="7" r="3.2"/><path d="M3.8 17c.9-3.2 3.3-4.8 6.2-4.8s5.3 1.6 6.2 4.8"/></svg>
        <span class="acct-dot" id="acct-dot" hidden></span>
      </button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="tools-bar">
    <button class="btn line useup-btn" id="useup-open" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="1.5" width="10" height="13" rx="2"/><path d="M3 6.5h10M5.5 3.8v1.2M5.5 8.7v2"/></svg>

  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="useup-title">
    <div class="sheet-head">
      <h2 id="useup-title">남은 재료로 뭐 먹지?</h2>
      <p>장보기 앱의 '구입한 것'에 남은 재료와 지금까지 넣었던 메뉴로 골랐어요.</p>
    </div>
    <div class="shop-body" id="useup-body"></div>

      <span class="spacer"></span>

      <h2 id="shop-title">장보기</h2>
      <p id="shop-sub"></p>
    </div>
    <div class="shop-body" id="shop-body"></div>

      <button type="button" class="btn ghost" id="shop-retry" hidden>다시 찾기</button>

      <button type="button" class="btn ghost" id="shop-close">닫기</button>

<div class="backdrop" id="acct" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="acct-title">
    <div class="sheet-head">
      <h2 id="acct-title">함께 보기</h2>
      <p>장보기 앱과 같은 가족 코드로 연결돼요.</p>
    </div>
    <div class="acct-body" id="acct-body"></div>
    <div class="sheet-actions">
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="acct-close">닫기</button>

<div class="backdrop" id="sheet" hidden>
  <form class="sheet" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
    <div class="sheet-head">
      <h2 id="sheet-title">메뉴 추가</h2>
      <p id="sheet-when"></p>
    </div>
    <div class="meal-pick" role="radiogroup" aria-label="끼니" id="meal-pick"></div>
    <div class="day-pick-wrap" id="day-pick-wrap">
      <div class="day-pick-head">
        <span>날짜<small>여러 날 고를 수 있어요</small></span>
        <button type="button" class="chip-link" id="pick-weekdays">월–금 모두</button>
      </div>
      <div class="day-pick" id="day-pick" role="group" aria-label="날짜 선택"></div>
    </div>
    <label class="field" for="f-text">
      <span>메뉴</span>
      <input id="f-text" maxlength="80" autocomplete="off" placeholder="예: 토스트">
    </label>
    <div class="suggest" id="f-suggest" hidden aria-label="전에 넣었던 메뉴"></div>
    <label class="field" for="f-url">
      <span>링크<em>선택 · 릴스나 유튜브 주소</em></span>
      <input id="f-url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="주소를 붙여넣으세요">
    </label>
    <p class="hint" id="f-hint"></p>
    <div class="sheet-actions">
      <button type="button" class="btn danger" id="f-delete" hidden>삭제</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="f-cancel">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</div>

<script>
(() => {
  const MEALS = [
    { key: 'lunch', label: '점심', hint: '' },
    { key: 'dinner', label: '저녁', hint: '' },
    { key: 'other', label: '기타', hint: '간식·음료' },
  ];
  const DOW = ['월', '화', '수', '목', '금', '토', '일'];
  const LS_KEY = 'yolk-meals-v1';

  const ICONS = {
    youtube: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="0.5" y="2.5" width="15" height="11" rx="3.2" fill="var(--yt)"/><path d="M6.4 5.4v5.2L10.8 8z" fill="var(--on-brand)"/></svg>',
    instagram: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="var(--ig)" stroke-width="1.7"><rect x="1.5" y="1.5" width="13" height="13" rx="4"/><circle cx="8" cy="8" r="3"/><circle cx="12" cy="4" r=".6" fill="var(--ig)" stroke="none"/></svg>',
    link: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="var(--link)" stroke-width="1.7" stroke-linecap="round"><path d="M6.6 9.4a3 3 0 0 0 4.2 0l2.1-2.1a3 3 0 0 0-4.2-4.2l-.9.9"/><path d="M9.4 6.6a3 3 0 0 0-4.2 0L3.1 8.7a3 3 0 0 0 4.2 4.2l.9-.9"/></svg>',
    cart: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 2.5h2l1.6 7.2h7l1.4-5.2H4.2"/><circle cx="6.2" cy="12.9" r="1.1"/><circle cx="11.4" cy="12.9" r="1.1"/></svg>',
    pencil: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.8 2.7a1.6 1.6 0 0 1 2.3 2.3L5.6 12.5 2.5 13.5l1-3.1z"/></svg>',
  };

  /* ---------- dates ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dowName = (d) => DOW[(d.getDay() + 6) % 7];
  const dowClass = (d) => (d.getDay() === 6 ? 'sat' : d.getDay() === 0 ? 'sun' : null);
  const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 864e5);
  const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };

  /* ---------- links ---------- */
  function normUrl(raw) {
    let s = (raw || '').trim();
    if (!s) return '';
    const m = s.match(/https?:\/\/[^\s<>"']+/i);
    if (m) s = m[0];
    else if (/^(www\.|m\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$)/i.test(s) && !/\s/.test(s)) s = 'https://' + s;
    else return null;
    try {
      const u = new URL(s);
      if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
      return u.href;
    } catch { return null; }
  }
  function platform(url) {
    try {
      const host = new URL(url).hostname.toLowerCase().replace(/^(www|m)\./, '');
      if (host === 'youtu.be' || host === 'youtube.com' || host.endsWith('.youtube.com')) return 'youtube';
      if (host === 'instagram.com' || host.endsWith('.instagram.com')) return 'instagram';
    } catch {}
    return 'link';
  }
  function defaultLabel(url) {
    const p = platform(url);
    if (p === 'youtube') return /\/shorts\//.test(url) ? '유튜브 쇼츠' : '유튜브 영상';
    if (p === 'instagram') return /\/reels?\//.test(url) ? '인스타 릴스' : '인스타그램';
    return '링크';
  }
  const PLATFORM_NAME = { youtube: '유튜브', instagram: '인스타그램', link: '웹' };

  /* ---------- state + storage ---------- */
  // This device keeps the whole plan in localStorage. When signed in, the household document
  // shared with the 장보기 app mirrors it under its `meals` field (see the module script below).
  // The view always shows 7 days in a row; it opens on today, so today's meals sit on top.
  let viewStart = startOfDay(new Date());

  const local = {
    load() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch { return {}; } },
    save(all) { try { localStorage.setItem(LS_KEY, JSON.stringify(all)); return true; } catch { return false; } },
    get(k, fallback) { try { const v = localStorage.getItem(LS_KEY + ':' + k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    put(k, v) { try { localStorage.setItem(LS_KEY + ':' + k, JSON.stringify(v)); } catch {} },
  };
  let days = local.load();
  // Dates changed while not connected; sent to the household on the next connect.
  const unsynced = new Set(local.get('unsynced', []));

  const statusEl = document.getElementById('status');
  function setStatus(state, text) { statusEl.dataset.state = state; statusEl.textContent = text; }

  const clone = (o) => JSON.parse(JSON.stringify(o || {}));
  const isEmptyDay = (d) => MEALS.every((m) => !(d && d[m.key] && d[m.key].length));
  function cleanDay(d) {
    const out = {};
    for (const m of MEALS) out[m.key] = (d[m.key] || []).map((it) => {
      const x = { id: String(it.id), text: String(it.text || ''), url: String(it.url || '') };
      // Ingredients found earlier for this menu, kept so the next 장보기 needs no new lookup.
      if (it.ing && Array.isArray(it.ing.list)) {
        x.ing = {
          dish: String(it.ing.dish || ''), src: !!it.ing.src, kind: String(it.ing.kind || ''),
          list: it.ing.list.slice(0, 60).map((i) => ({ name: String(i.name || ''), amount: String(i.amount || '') })),
        };
      }
      return x;
    });
    return out;
  }

  function saveDay(key, data) {
    const empty = isEmptyDay(data);
    if (empty) delete days[key]; else days[key] = cleanDay(data);
    if (!local.save(days)) setStatus('error', '이 기기에 저장하지 못했어요');
    render();
    if (window.cloud && window.cloud.live) window.cloud.push(key, empty ? null : days[key]);
    else { unsynced.add(key); local.put('unsynced', [...unsynced]); }
  }

  // Hooks for the sync module.
  window.meals = {
    days: () => days,
    unsynced,
    clearUnsynced() { unsynced.clear(); local.put('unsynced', []); },
    syncedHouse: () => local.get('house', null),
    setSyncedHouse: (code) => local.put('house', code),
    setDays(next) { days = next; local.save(days); render(); },
    refresh: () => renderAccount(),
  };

  /* ---------- render ---------- */
  const board = document.getElementById('board');
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) { if (v === null || v === undefined || v === false) continue; n.setAttribute(k, v === true ? '' : v); }
    for (const k of kids) if (k !== null && k !== undefined && k !== false) n.append(k);
    return n;
  }

  function renderItem(it, key, meal) {
    const li = el('li', { class: 'item' });
    let main;
    if (it.url) {
      const p = platform(it.url);
      main = el('a', { class: 'item-main', href: it.url, target: '_blank', rel: 'noopener noreferrer', title: `${PLATFORM_NAME[p]}에서 열기` });
      main.insertAdjacentHTML('beforeend', ICONS[p]);
    } else {
      main = el('button', { class: 'item-main', type: 'button', 'data-edit': it.id, 'data-key': key, 'data-meal': meal });
    }
    main.append(el('span', { class: 'txt' }, it.text));
    const edit = el('button', { class: 'item-edit', type: 'button', 'aria-label': `${it.text} 수정`, 'data-edit': it.id, 'data-key': key, 'data-meal': meal });
    edit.innerHTML = ICONS.pencil;
    const cart = el('button', { class: 'item-cart', type: 'button', 'aria-label': `${it.text} 재료 장보기`, title: '장보기에 재료 넣기', 'data-shop': it.id, 'data-key': key, 'data-meal': meal });
    cart.innerHTML = ICONS.cart;
    li.append(main, el('span', { class: 'item-tools' }, cart, edit));
    return li;
  }

  function render() {
    const todayKey = dateKey(new Date());
    const end = addDays(viewStart, 6);
    const sameMonth = end.getMonth() === viewStart.getMonth();
    document.getElementById('range-label').textContent =
      `${viewStart.getMonth() + 1}월 ${viewStart.getDate()}일 – ${sameMonth ? '' : (end.getMonth() + 1) + '월 '}${end.getDate()}일`;
    const offset = daysBetween(new Date(), viewStart);
    document.getElementById('range-sub').textContent =
      offset === 0 ? '오늘부터 7일' : offset > 0 ? `${offset}일 뒤부터 7일` : `${-offset}일 전부터 7일`;
    document.getElementById('today').disabled = offset === 0;

    const frag = document.createDocumentFragment();
    const labels = el('div', { class: 'labels', 'aria-hidden': 'true' }, el('div'));
    for (const m of MEALS) labels.append(el('div', { class: 'row-label' }, el('span', null, m.label), m.hint ? el('small', null, m.hint) : null));
    frag.append(labels);

    let filled = 0, links = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(viewStart, i);
      const key = dateKey(d);
      const data = days[key] || {};
      const isToday = key === todayKey;
      const col = el('section', { class: 'day' + (isToday ? ' is-today' : ''), 'aria-label': `${d.getMonth() + 1}월 ${d.getDate()}일 ${dowName(d)}요일` });
      col.append(el('header', { class: 'day-head' },
        el('span', { class: 'dow' + (dowClass(d) ? ' ' + dowClass(d) : '') }, dowName(d)),
        el('span', { class: 'dnum' }, String(d.getDate())),
        isToday ? el('span', { class: 'today-tag' }, '오늘') : null));
      for (const m of MEALS) {
        const items = Array.isArray(data[m.key]) ? data[m.key] : [];
        if (items.length) filled++;
        links += items.filter((x) => x.url).length;
        const slot = el('div', { class: 'slot' + (items.length ? '' : ' is-empty'), 'data-key': key, 'data-meal': m.key });
        slot.append(el('span', { class: 'slot-label' }, m.label));
        if (items.length) {
          const ul = el('ul', { class: 'items' });
          items.forEach((it) => ul.append(renderItem(it, key, m.key)));
          slot.append(ul);
        }
        slot.append(el('button', { class: 'add', type: 'button', 'data-add': '1', 'aria-label': `${d.getMonth() + 1}월 ${d.getDate()}일 ${m.label} 메뉴 추가` }, '+ 추가'));
        col.append(slot);
      }
      frag.append(col);
    }
    board.replaceChildren(frag);

    const sum = document.getElementById('summary');
    sum.replaceChildren(
      '7일 동안 ', el('strong', null, `${filled}`), ` / ${MEALS.length * 7}칸 채움`,
      links ? ' · 링크 ' : '', links ? el('strong', null, `${links}개`) : '');
  }

  // legend
  document.getElementById('lg-yt').innerHTML = ICONS.youtube + '유튜브';
  document.getElementById('lg-ig').innerHTML = ICONS.instagram + '인스타';
  document.getElementById('lg-link').innerHTML = ICONS.link + '기타 링크';

  /* ---------- editor ---------- */
  const sheet = document.getElementById('sheet');
  const form = document.getElementById('sheet-form');
  const fText = document.getElementById('f-text');
  const fUrl = document.getElementById('f-url');
  const fHint = document.getElementById('f-hint');
  const fDelete = document.getElementById('f-delete');
  const mealPick = document.getElementById('meal-pick');
  MEALS.forEach((m) => {
    mealPick.append(
      el('input', { type: 'radio', name: 'meal', id: 'meal-' + m.key, value: m.key }),
      el('label', { for: 'meal-' + m.key }, m.label));
  });

  let editing = null; // {key, meal, id|null}
  let returnFocus = null;

  function findItem(key, meal, id) {
    const list = (days[key] && days[key][meal]) || [];
    return list.find((x) => x.id === id) || null;
  }

  /* ---------- 메뉴 기억: every menu ever planned, by name ---------- */
  // Built from the plan itself, so it syncs like the plan. A name typed again brings back the
  // menu's last link and the 재료 found for it.
  const normName = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();
  function menuLibrary() {
    const lib = new Map();
    for (const key of Object.keys(days).sort()) {
      for (const m of MEALS) {
        for (const it of (days[key] && days[key][m.key]) || []) {
          const k = normName(it.text);
          if (!k) continue;
          const e = lib.get(k) || { name: it.text, url: '', ing: null, count: 0, last: key, meal: m.key };
          e.name = it.text; e.count++; e.last = key; e.meal = m.key;
          if (it.url) e.url = it.url;
          if (it.ing && it.ing.list && it.ing.list.length && (!it.url || it.url === e.url)) e.ing = it.ing;
          lib.set(k, e);
        }
      }
    }
    return lib;
  }
  const remembered = (name) => menuLibrary().get(normName(name)) || null;

  function openEditor(key, meal, id, trigger, prefill) {
    const item = id ? findItem(key, meal, id) : null;
    editing = { key, meal, id: item ? id : null };
    returnFocus = trigger || null;
    const d = fromKey(key);
    document.getElementById('sheet-title').textContent = item ? '메뉴 수정' : '메뉴 추가';
    document.getElementById('sheet-when').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${dowName(d)}요일`;
    form.elements.meal.value = meal;
    buildDayPick(key);
    document.getElementById('day-pick-wrap').hidden = !!item;
    fText.value = item ? item.text : (prefill && prefill.text) || '';
    fUrl.value = item ? item.url : (prefill && prefill.url) || '';
    fDelete.hidden = !item;
    fDelete.classList.remove('armed'); fDelete.textContent = '삭제';
    renderSuggest();
    updateHint();
    sheet.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    setTimeout(() => fText.focus(), 30);
  }
  // Day checkboxes for the week of the clicked date; the clicked day starts checked.
  const dayPick = document.getElementById('day-pick');
  function buildDayPick(key) {
    // The 7 days on screen; fall back to a 7-day run from the clicked date if it is off screen.
    const offset = daysBetween(viewStart, fromKey(key));
    const start = offset >= 0 && offset < 7 ? viewStart : fromKey(key);
    dayPick.replaceChildren();
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i);
      const k = dateKey(d);
      const input = el('input', { type: 'checkbox', id: 'day-' + i, value: k, 'data-weekday': dowClass(d) ? null : '1' });
      input.checked = k === key;
      dayPick.append(input, el('label', { for: 'day-' + i, class: dowClass(d) },
        el('b', null, dowName(d)), el('span', null, String(d.getDate()))));
    }
  }
  document.getElementById('pick-weekdays').addEventListener('click', () => {
    const weekdays = [...dayPick.querySelectorAll('input[data-weekday]')];
    const allOn = weekdays.every((x) => x.checked);
    weekdays.forEach((x) => { x.checked = !allOn; });
  });

  function closeEditor() {
    sheet.hidden = true; editing = null;
    document.documentElement.style.overflow = '';
    if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
  }

  function updateHint(errText) {
    fHint.classList.toggle('err', !!errText);
    if (errText) { fHint.textContent = errText; return; }
    const raw = fUrl.value.trim();
    if (!raw) {
      fHint.textContent = '';
      const memo = editing && !editing.id && fText.value.trim() ? remembered(fText.value) : null;
      if (memo && memo.url) {
        fHint.innerHTML = ICONS[platform(memo.url)];
        fHint.append(memo.ing ? '전에 넣은 링크와 찾아둔 재료를 같이 넣어요' : '전에 넣은 링크를 같이 넣어요');
      } else if (memo && memo.ing) fHint.textContent = '전에 찾아둔 재료를 같이 기억해요';
      return;
    }
    const url = normUrl(raw);
    if (url === null) { fHint.textContent = 'https:// 로 시작하는 주소인지 확인해 주세요'; fHint.classList.add('err'); return; }
    const p = platform(url);
    fHint.innerHTML = ICONS[p];
    fHint.append(`${PLATFORM_NAME[p]} 링크 · 주소는 숨기고 메뉴 이름을 누르면 열려요`);
  }

  // Pasting a link into the menu field moves it to the link field.
  fText.addEventListener('input', () => {
    const m = fText.value.match(/https?:\/\/[^\s<>"']+/i);
    if (m && !fUrl.value.trim()) {
      fUrl.value = m[0];
      fText.value = fText.value.replace(m[0], '').replace(/\s{2,}/g, ' ').trim();
    }
    renderSuggest();
    updateHint();
  });

  // Past menus matching what is typed, most-used first; tapping one fills in its name (and link).
  const fSuggest = document.getElementById('f-suggest');
  function renderSuggest() {
    fSuggest.replaceChildren();
    const q = normName(fText.value);
    if (!editing || editing.id || !q) { fSuggest.hidden = true; return; }
    const hits = [...menuLibrary().values()]
      .filter((e) => normName(e.name).includes(q) && normName(e.name) !== q)
      .sort((a, b) => b.count - a.count || (a.last < b.last ? 1 : -1))
      .slice(0, 6);
    fSuggest.hidden = !hits.length;
    for (const e of hits) {
      const chip = el('button', { type: 'button', class: 'chip', 'data-name': e.name });
      if (e.url) chip.insertAdjacentHTML('beforeend', ICONS[platform(e.url)]);
      chip.append(e.name);
      fSuggest.append(chip);
    }
  }
  fSuggest.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    fText.value = chip.dataset.name;
    renderSuggest();
    updateHint();
    fText.focus();
  });
  fUrl.addEventListener('input', () => updateHint());

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!editing) return;
    let text = fText.value.trim();
    const url = fUrl.value.trim() ? normUrl(fUrl.value) : '';
    if (url === null) { updateHint('https:// 로 시작하는 주소인지 확인해 주세요'); fUrl.focus(); return; }
    if (!text && !url) { updateHint('메뉴 이름이나 링크를 적어 주세요'); fText.focus(); return; }
    if (!text) text = defaultLabel(url);
    const meal = form.elements.meal.value || editing.meal;
    const prepared = (k) => {
      const day = clone(days[k]);
      MEALS.forEach((m) => { if (!Array.isArray(day[m.key])) day[m.key] = []; });
      return day;
    };
    if (editing.id) {
      const day = prepared(editing.key);
      const list = day[editing.meal];
      const idx = list.findIndex((x) => x.id === editing.id);
      const updated = { id: editing.id, text, url };
      const prev = findItem(editing.key, editing.meal, editing.id);
      if (prev && prev.ing && prev.url === url) updated.ing = prev.ing;
      if (idx >= 0 && meal === editing.meal) list[idx] = updated;
      else { if (idx >= 0) list.splice(idx, 1); day[meal].push(updated); }
      const key = editing.key;
      closeEditor();
      saveDay(key, day);
      return;
    }
    const keys = [...dayPick.querySelectorAll('input:checked')].map((x) => x.value);
    if (!keys.length) { updateHint('날짜를 하나 이상 골라 주세요'); return; }
    // A menu planned before brings back its link (if none was given) and the 재료 found for that link.
    const memo = remembered(text);
    const useUrl = url || (memo && memo.url) || '';
    const ing = memo && memo.ing && (!memo.url || memo.url === useUrl) ? memo.ing : null;
    closeEditor();
    for (const k of keys) {
      const day = prepared(k);
      const entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), text, url: useUrl };
      if (ing) entry.ing = clone(ing);
      day[meal].push(entry);
      saveDay(k, day);
    }
  });

  fDelete.addEventListener('click', () => {
    if (!editing || !editing.id) return;
    if (!fDelete.classList.contains('armed')) {
      fDelete.classList.add('armed'); fDelete.textContent = '한 번 더 누르면 삭제';
      return;
    }
    const day = clone(days[editing.key]);
    day[editing.meal] = (day[editing.meal] || []).filter((x) => x.id !== editing.id);
    const key = editing.key;
    closeEditor();
    saveDay(key, day);
  });
  document.getElementById('f-cancel').addEventListener('click', closeEditor);
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeEditor(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!sheet.hidden) closeEditor(); else if (!shop.hidden) closeShop();
    else if (!useup.hidden) closeUseUp(); else if (!acct.hidden) closeAcct();
  });

  /* ---------- 장보기: 재료 from the menu's link into the 장보기 app (no AI, no cost) ---------- */
  // Browsers can't read Notion/YouTube/Instagram pages from here, so a small free server fetches the text;
  // the 재료 list is then found by the rules in parseIngredients below. With READER_URL empty, link reading
  // is skipped and pasting a recipe or typing 재료 still works.
  const READER_URL = 'https://weekly-meals-reader.weekly-meals-reader.workers.dev/read';

  const AMOUNT_WORDS = '약간|적당량|적당히|조금|한\\s?줌|한\\s?꼬집|반\\s?개|반\\s?모|반\\s?컵|취향껏|넉넉히|기호에\\s?따라|취향에\\s?따라|기호껏|간\\s?맞추기|간\\s?맞춤';
  const AMOUNTISH = new RegExp(`^(약\\s*)?([0-9½¼¾⅓⅔⅛]|${AMOUNT_WORDS})`, 'u');
  const AMOUNT_AT = new RegExp(`[0-9½¼¾⅓⅔⅛]|${AMOUNT_WORDS}`, 'u');
  const UNIT_RE = /\d\s*(kg|g|mg|ml|l|cc|컵|큰술|작은술|숟가락|스푼|티스푼|T|t|개|알|모|쪽|줌|꼬집|대|뿌리|장|봉지|팩|캔|통|단|포기|마리|토막|조각|덩이|공기|톨|줄기)/i;
  const RE_HEAD = /^[^\p{L}\p{N}]*(주\s*재료|부\s*재료|기본\s*재료|재료|양념\s*장?|소스|드레싱|ingredients?)(?=$|[^\p{L}])/iu;
  // A short heading that ends in the keyword: "※ 닭볶음탕 양념", "[불고기 소스]"
  const RE_HEAD_TAIL = /^([^\p{L}\p{N}]*)([\p{L}\s]{0,15}\s)(재료|양념\s*장?|소스|드레싱)[\s:：\]】)]*$/u;
  const RE_STOP = /^[^\p{L}\p{N}]*(만드는|만들기|조리\s*(법|방법|순서)|요리\s*(법|순서|방법)|레시피\s*(순서|방법)|순서|방법|how\s*to|directions|instructions|method|tip\b|팁|준비물|도구|주의\s*사항|참고|(레시피|recipe)[\s:：]*$)/iu;
  const LEAD_JUNK = /^[\s\p{P}\p{S}\p{Extended_Pictographic}️‍]+/u;
  const TRAIL_JUNK = /[\s\p{Extended_Pictographic}️‍]+$/u;

  // Long lines are sentences, unless they are comma lists ("닭 1마리, 감자 2개, 양파 1/2개, …").
  const looksLikeSentence = (l) => {
    const t = String(l).replace(/\s*⟦[^⟧]*⟧/g, '');
    return (t.length > 45 && !/[,，、]/.test(t)) || t.length > 200 ||
      /(요|다|니다|세요|해요|어요|아요)[.!~♡♥\s\p{Extended_Pictographic}️]*$/u.test(t);
  };

  // "돼지고기 앞다리살 300g" → { name: "돼지고기 앞다리살", amount: "300g" }
  function splitNameAmount(piece) {
    // Amounts written in brackets come in as ⟦…⟧ ("닭 ⟦1마리-1.5kg⟧"); used only when no other amount is given.
    const bracketed = [];
    let s = String(piece).replace(/\s*⟦([^⟧]*)⟧/g, (_, a) => { bracketed.push(a.trim()); return ''; });
    s = s.replace(LEAD_JUNK, '').replace(/^\d+[.)]\s+/, '').replace(TRAIL_JUNK, '').trim();
    if (!s || s.length > 40) return null;
    let name = s, amount = '';
    const idx = s.search(AMOUNT_AT);
    if (idx === 0) {
      // Amount first, as in many baking recipes: "125g 무염버터", "1/2 양파"
      const m = s.match(/^([0-9½¼¾⅓⅔⅛.,/~+\-]+\s*[A-Za-z가-힣]{0,4})\s+(\D.*)$/u);
      if (!m) return null;
      amount = m[1].trim();
      name = m[2];
    } else if (idx > 0) { name = s.slice(0, idx); amount = s.slice(idx).trim(); }
    name = name.replace(/[\s:：\-–=]+$/, '').trim();
    if (!amount && bracketed.length) amount = bracketed[0];
    if (!name || name.length > 20 || /^(물|생수|얼음|찬물|끓는\s*물)$/.test(name)) return null;
    return { name, amount: amount.slice(0, 30) };
  }
  function splitPieces(line) {
    return String(line).replace(LEAD_JUNK, '')
      .split(/\s*[,，、]\s*|\s+[·•|]\s+|\s{3,}/)
      .map((x) => x.trim()).filter(Boolean);
  }
  // Finds the 재료 / 양념 lists in a recipe text. Works when the recipe writes its 재료 as a list,
  // which Notion recipes, most YouTube descriptions and many reels captions do.
  function parseIngredients(text) {
    // Brackets: a short amount ("닭(1마리)", "후추(취향에 따라)") is kept as ⟦…⟧; any other note
    // ("200g (실온에 두기)") is dropped so it doesn't read as a sentence or split on its commas.
    const bracket = (_, inner) => {
      const t = inner.trim();
      return t.length <= 20 && AMOUNTISH.test(t) && !t.includes(',') ? ` ⟦${t}⟧` : '';
    };
    const lines = String(text || '').replace(/\r/g, '').split('\n')
      .map((l) => {
        let prev;
        do { prev = l; l = l.replace(/\s*[(（]([^()（）]*)[)）]/g, bracket); } while (l !== prev); // nested ( ( ) )
        return l.replace(/\s*[(（][^)）]*$/, '').trim(); // a bracket left open to the end of the line
      });
    const out = [], seen = new Set();
    const push = (piece) => {
      if (looksLikeSentence(piece)) return;
      const x = splitNameAmount(piece);
      if (!x) return;
      const k = x.name.toLowerCase();
      if (seen.has(k)) return;
      seen.add(k);
      out.push(x);
    };
    let inList = false, blanks = 0;
    for (const line of lines) {
      if (!line) { if (inList && ++blanks >= 2) inList = false; continue; }
      blanks = 0;
      const tail = !/\d/.test(line) && line.match(RE_HEAD_TAIL);
      if (tail && (/^(재료|양념)/.test(tail[3]) || tail[1].trim())) { inList = true; continue; }
      const head = line.match(RE_HEAD);
      if (head) {
        // Many videos repeat the list in English; once Korean 재료 are found, skip the English copy.
        if (/^ingredients?$/i.test(head[1]) && out.length) { inList = false; continue; }
        inList = true;
        // "재료 (2인분)", "[양념]", "재료: 김치 1/4포기, 두부 1모"
        const rest = line.slice(head[0].length)
          .replace(/^[\s\]】)>]*(\([^)]*\)|（[^）]*）|\[[^\]]*\])?[\s\]】)>]*[:：\-–]?\s*/, '');
        splitPieces(rest).forEach(push);
        continue;
      }
      if (!inList) continue;
      if (line.startsWith('#') || RE_STOP.test(line) || looksLikeSentence(line)) { inList = false; continue; }
      const numbered = line.match(/^(\d+[.)]|[①-⑳])\s*(.*)$/);
      if (numbered && !AMOUNT_AT.test(numbered[2])) { inList = false; continue; }
      splitPieces(line).forEach(push);
    }
    if (!out.length) {
      // No 재료 heading: use lines that read like "이름 300g".
      const lists = lines.filter((l) => l && !looksLikeSentence(l) && !l.startsWith('#') && UNIT_RE.test(l));
      if (lists.length >= 3) lists.forEach((l) => splitPieces(l).forEach(push));
    }
    return out;
  }
  window.parseIngredients = parseIngredients; // handy for checking a recipe text in the console

  const shop = document.getElementById('shop');
  const shopBody = document.getElementById('shop-body');
  const shopAdd = document.getElementById('shop-add');
  const shopRetry = document.getElementById('shop-retry');
  let shopping = null; // { key, meal, id, item, list: [{name, amount, on}], note, count, added, trigger }
  let shopSeq = 0;

  const canAddToShopping = () => !!(window.cloud && window.cloud.live);
  const canReadLinks = () => !!(READER_URL && canAddToShopping());
  const ownedNames = () => (window.cloud && window.cloud.shoppingNames ? window.cloud.shoppingNames() : new Set());
  function setList(list, note) {
    const have = ownedNames();
    shopping.list = list.map((x) => ({ name: x.name, amount: x.amount || '', on: !have.has(x.name.trim().toLowerCase()) }));
    shopping.note = note;
    shopping.count = list.length;
    renderShop('list');
  }

  function openShop(key, meal, id, trigger) {
    const item = findItem(key, meal, id);
    if (!item) return;
    // Fall back to what is remembered for this menu name (its link, the 재료 found before).
    const memo = remembered(item.text);
    const url = item.url || (memo && memo.url) || '';
    const ing = (item.ing && item.ing.list && item.ing.list.length && item.ing) || (memo && memo.ing && (!item.url || memo.url === item.url) && memo.ing);
    shopping = { key, meal, id, item, url, trigger, list: [] };
    document.getElementById('shop-sub').textContent = item.text;
    shop.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    if (ing) setList(ing.list, 'saved');
    else if (url && canReadLinks()) readFromLink();
    else setList([], !url ? 'no-link' : !READER_URL ? 'no-reader' : 'login-read');
  }
  function closeShop() {
    shopSeq++;
    shop.hidden = true;
    document.documentElement.style.overflow = '';
    if (shopping && shopping.trigger && document.contains(shopping.trigger)) shopping.trigger.focus();
    shopping = null;
  }
  document.getElementById('shop-close').addEventListener('click', closeShop);
  shop.addEventListener('click', (e) => { if (e.target === shop) closeShop(); });
  shopRetry.addEventListener('click', () => readFromLink());

  async function readFromLink() {
    if (!shopping) return;
    const seq = ++shopSeq;
    renderShop('loading');
    try {
      const token = await window.cloud.idToken();
      const r = await fetch(READER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ url: shopping.url }),
      });
      const data = await r.json().catch(() => ({}));
      if (seq !== shopSeq || !shopping) return;
      if (!r.ok) { setList(shopping.list, r.status === 401 ? 'expired' : 'read-failed'); return; }
      const found = parseIngredients(data.text);
      if (found.length) setList(found, 'found');
      else setList(shopping.list, !data.read ? (data.kind === 'instagram' ? 'insta-blocked' : 'read-failed') : 'no-section');
    } catch (err) {
      console.warn(err);
      if (seq !== shopSeq || !shopping) return;
      setList(shopping.list, 'offline');
    }
  }

  const NOTES = {
    saved: ['전에 찾은 재료예요. 필요 없는 재료는 체크를 빼 주세요.', ''],
    found: ['링크에서 재료 {n}개를 찾았어요. 필요 없는 재료는 체크를 빼 주세요.', ''],
    pasted: ['붙여넣은 글에서 재료 {n}개를 찾았어요.', ''],
    'paste-none': ["붙여넣은 글에서 '재료' 목록을 찾지 못했어요. 재료를 직접 적어 주세요.", 'warn'],
    'no-section': ["링크에서 '재료' 목록을 찾지 못했어요. 영상에서 말로만 소개한 재료는 읽을 수 없어요. 글을 붙여넣거나 재료를 직접 적어 주세요.", 'warn'],
    'insta-blocked': ['인스타가 글을 보여주지 않았어요. 릴스 글을 복사해서 붙여넣거나 재료를 직접 적어 주세요.', 'warn'],
    'read-failed': ['링크를 읽지 못했어요. 글을 붙여넣거나 재료를 직접 적어 주세요.', 'warn'],
    offline: ['인터넷 연결을 확인해 주세요. 재료를 직접 적을 수도 있어요.', 'warn'],
    expired: ['로그인이 만료됐어요. 로그아웃했다가 다시 로그인해 주세요.', 'warn'],
    'no-link': ['레시피 글을 붙여넣거나 재료를 직접 적어 주세요.', ''],
    'no-reader': ['링크 읽기는 아직 준비 중이에요. 레시피 글을 붙여넣거나 재료를 직접 적어 주세요.', ''],
    'login-read': ['로그인하면 링크에서 재료를 찾아 드려요. 지금은 글을 붙여넣거나 재료를 직접 적어 주세요.', ''],
    manual: ['필요 없는 재료는 체크를 빼 주세요.', ''],
  };

  function renderShop(state) {
    if (!shopping) return;
    const msg = (text, cls) => el('p', { class: 'shop-msg' + (cls ? ' ' + cls : '') }, text);
    shopBody.replaceChildren();
    shopAdd.hidden = true;
    shopRetry.hidden = true;

    if (state === 'loading') {
      shopBody.append(el('div', { class: 'shop-loading', role: 'status' }, el('span', { class: 'spinner' }), '링크를 읽고 있어요…'));
      return;
    }
    if (state === 'done') {
      shopBody.append(msg(shopping.added
        ? `장보기 앱의 슈퍼마켓 목록에 ${shopping.added}개를 넣었어요.`
        : '고른 재료가 이미 장보기 목록에 모두 있어요.'));
      return;
    }

    const [note, cls] = NOTES[shopping.note] || NOTES.manual;
    shopBody.append(msg(note.replace('{n}', shopping.count), cls));

    const have = ownedNames();
    if (shopping.list.length) {
      const ul = el('ul', { class: 'ing-list' });
      shopping.list.forEach((ing, i) => {
        const owned = have.has(ing.name.trim().toLowerCase());
        const box = el('input', { type: 'checkbox', id: 'ing-' + i, 'data-i': String(i) });
        box.checked = ing.on;
        ul.append(el('li', { class: owned ? 'have' : null },
          el('label', { for: 'ing-' + i }, box,
            el('span', { class: 'ing-name' }, ing.name, owned ? el('span', { class: 'ing-have' }, '· 이미 목록에 있어요') : null),
            ing.amount ? el('span', { class: 'ing-amount' }, ing.amount) : null)));
      });
      shopBody.append(ul);
    }

    // Type a 재료 yourself
    const addInput = el('input', { id: 'shop-new', placeholder: '재료 직접 추가 (예: 두부 1모)', autocomplete: 'off', 'aria-label': '재료 직접 추가' });
    const addBtn = el('button', { class: 'btn line', type: 'button' }, '추가');
    const addOne = () => {
      const x = splitNameAmount(addInput.value) || (addInput.value.trim() ? { name: addInput.value.trim().slice(0, 20), amount: '' } : null);
      if (!x) { addInput.focus(); return; }
      if (!shopping.list.some((y) => y.name === x.name)) shopping.list.push({ ...x, on: true });
      if (!['found', 'saved', 'pasted'].includes(shopping.note)) shopping.note = 'manual';
      renderShop('list');
      const again = document.getElementById('shop-new');
      if (again) again.focus();
    };
    addBtn.addEventListener('click', addOne);
    addInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addOne(); } });
    shopBody.append(el('div', { class: 'acct-row' }, addInput, addBtn));

    // Paste a recipe text (e.g. a reel's caption)
    const area = el('textarea', { id: 'shop-paste', placeholder: '레시피 글이나 릴스 설명을 붙여넣으세요', 'aria-label': '레시피 글' });
    const findBtn = el('button', { class: 'btn line', type: 'button' }, '이 글에서 재료 찾기');
    findBtn.addEventListener('click', () => {
      const t = area.value.trim();
      if (!t) { area.focus(); return; }
      const found = parseIngredients(t);
      if (found.length) setList(found, 'pasted'); else { shopping.note = 'paste-none'; renderShop('list'); }
    });
    const details = el('details', { class: 'paste' }, el('summary', null, '레시피 글 붙여넣기'), area, el('div', { class: 'acct-row' }, findBtn));
    if (!shopping.list.length) details.open = true;
    shopBody.append(details);

    if (!canAddToShopping()) {
      const go = el('button', { class: 'btn line', type: 'button' }, '로그인하기');
      go.addEventListener('click', () => { closeShop(); openAcct(); });
      shopBody.append(msg('장보기 앱에 넣으려면 오른쪽 위 사람 아이콘에서 구글로 로그인해 주세요.'), el('div', { class: 'acct-row' }, go));
    } else {
      shopAdd.hidden = false;
      updateShopCount();
    }
    if (shopping.url && canReadLinks()) shopRetry.hidden = false;
  }

  function updateShopCount() {
    const n = shopping ? shopping.list.filter((x) => x.on).length : 0;
    shopAdd.textContent = n ? `슈퍼마켓에 ${n}개 넣기` : '슈퍼마켓에 넣기';
    shopAdd.disabled = !n;
  }
  shopBody.addEventListener('change', (e) => {
    const box = e.target.closest('.ing-list input');
    if (!box || !shopping) return;
    const x = shopping.list[Number(box.dataset.i)];
    if (x) x.on = box.checked;
    updateShopCount();
  });
  shopAdd.addEventListener('click', () => {
    if (!shopping || !canAddToShopping()) return;
    const picks = shopping.list.filter((x) => x.on);
    if (!picks.length) return;
    // Remember this menu's 재료 for next time.
    const day = clone(days[shopping.key]);
    const target = (day[shopping.meal] || []).find((x) => x.id === shopping.id);
    if (target) {
      target.ing = { dish: '', src: true, kind: '', list: shopping.list.map((x) => ({ name: x.name, amount: x.amount })) };
      saveDay(shopping.key, day);
    }
    // Only the amount goes along as the memo; the menu's name stays out of the 장보기 app.
    shopping.added = window.cloud.addToShopping(picks.map((p) => ({ name: p.name, note: p.amount })));
    renderShop('done');
  });

  /* ---------- 남은 재료로 뭐 먹지? ---------- */
  // Ranks every remembered menu by how many of the 장보기 app's bought-and-not-used-up items it uses,
  // counting items close to their 유통기한 more. Staples (salt, soy sauce, oil…) barely count.
  const STAPLES = new Set(['소금', '설탕', '흑설탕', '백설탕', '간장', '국간장', '진간장', '양조간장', '식용유', '올리브유',
    '포도씨유', '참기름', '들기름', '후추', '후춧가루', '깨', '통깨', '참깨', '물엿', '올리고당', '식초', '맛술', '미림',
    'msg', '다시다', '굴소스', '케첩', '마요네즈', '물', '고춧가루', '고추가루', '다진마늘', '깨소금'].map(normName));
  const isStaple = (n) => STAPLES.has(normName(n));
  const sameThing = (a, b) => {
    a = normName(a); b = normName(b);
    return a === b || (b.length >= 2 && a.includes(b)) || (a.length >= 2 && b.includes(a));
  };
  const urgency = (left) => (left === null ? 1 : left <= 2 ? 3 : left <= 5 ? 2 : 1);

  function recommend(stock, lib) {
    const out = [];
    for (const e of lib.values()) {
      const byName = !(e.ing && e.ing.list && e.ing.list.length);
      const names = byName ? [] : e.ing.list.map((x) => x.name);
      const used = stock.filter((s) => (byName
        ? normName(s.name).length >= 2 && normName(e.name).includes(normName(s.name))
        : names.some((n) => sameThing(n, s.name))));
      if (!used.some((s) => !isStaple(s.name))) continue;
      const score = used.reduce((t, s) => t + (isStaple(s.name) ? 0.2 : urgency(s.left)), 0);
      const missing = names.filter((n) => !isStaple(n) && !stock.some((s) => sameThing(n, s.name)));
      out.push({ e, used, score, missing, byName });
    }
    return out
      .sort((a, b) => b.score - a.score || a.missing.length - b.missing.length || b.e.count - a.e.count)
      .slice(0, 8);
  }

  const useup = document.getElementById('useup');
  const useupBody = document.getElementById('useup-body');
  let useupOpen = false, reading = 0;
  const triedLinks = new Set(); // links already read this visit without finding 재료

  function openUseUp() {
    useupOpen = true;
    useup.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    renderUseUp();
    readMissingIngredients();
  }
  function closeUseUp() {
    useupOpen = false;
    useup.hidden = true;
    document.documentElement.style.overflow = '';
  }
  document.getElementById('useup-open').addEventListener('click', openUseUp);
  document.getElementById('useup-close').addEventListener('click', closeUseUp);
  useup.addEventListener('click', (e) => { if (e.target === useup) closeUseUp(); });

  // Menus with a link whose 재료 were never looked up: read them now and remember the result.
  async function readMissingIngredients() {
    if (!canReadLinks()) return;
    const todo = [...menuLibrary().values()].filter((e) => e.url && !e.ing && !triedLinks.has(e.url)).slice(0, 15);
    if (!todo.length) return;
    let token;
    try { token = await window.cloud.idToken(); } catch { return; }
    reading = todo.length;
    renderUseUp();
    const one = async (e) => {
      triedLinks.add(e.url);
      try {
        const r = await fetch(READER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ url: e.url }),
        });
        const data = r.ok ? await r.json() : null;
        const found = data ? parseIngredients(data.text) : [];
        if (found.length) {
          // Keep it on the menu's latest entry, where 메뉴 기억 and 🛒 will find it.
          const day = clone(days[e.last]);
          const target = MEALS.flatMap((m) => day[m.key] || []).reverse().find((x) => normName(x.text) === normName(e.name));
          if (target) {
            target.ing = { dish: '', src: true, kind: data.kind || '', list: found };
            if (!target.url) target.url = e.url;
            saveDay(e.last, day);
          }
        }
      } catch (err) { console.warn('read', e.url, err); }
      reading--;
      if (useupOpen) renderUseUp();
    };
    const queue = [...todo];
    await Promise.all([0, 1, 2].map(async () => { while (queue.length) await one(queue.shift()); }));
  }

  function renderUseUp() {
    if (!useupOpen) return;
    const msg = (text, cls) => el('p', { class: 'shop-msg' + (cls ? ' ' + cls : '') }, text);
    useupBody.replaceChildren();
    if (!canAddToShopping()) {
      const go = el('button', { class: 'btn line', type: 'button' }, '로그인하기');
      go.addEventListener('click', () => { closeUseUp(); openAcct(); });
      useupBody.append(msg('장보기 앱의 남은 재료를 보려면 오른쪽 위 사람 아이콘에서 구글로 로그인해 주세요.'), el('div', { class: 'acct-row' }, go));
      return;
    }
    const today = new Date();
    const stock = window.cloud.stockItems()
      .map((s) => ({ name: String(s.name), left: s.expires ? daysBetween(today, fromKey(String(s.expires).slice(0, 10))) : null }))
      .sort((a, b) => (a.left === null) - (b.left === null) || (a.left ?? 0) - (b.left ?? 0));
    if (!stock.length) {
      useupBody.append(msg("장보기 앱의 '구입한 것' 목록이 비어 있어요. 장 본 재료를 '샀어요'로 옮기면 여기서 메뉴를 추천해 드려요."));
      return;
    }

    const leftText = (l) => (l === null ? '' : l < 0 ? '기한 지남' : l === 0 ? '오늘까지' : `${l}일`);
    const chips = el('div', { class: 'stock-chips' });
    for (const s of stock.slice(0, 14)) {
      chips.append(el('span', { class: 'chip' + (s.left !== null && s.left <= 2 ? ' soon' : '') }, s.name, s.left !== null ? el('small', null, leftText(s.left)) : null));
    }
    if (stock.length > 14) chips.append(el('span', { class: 'chip' }, el('small', null, `외 ${stock.length - 14}개`)));
    useupBody.append(el('p', { class: 'shop-msg' }, `남은 재료 ${stock.length}개`), chips);

    if (reading > 0) {
      useupBody.append(el('div', { class: 'shop-loading', role: 'status' }, el('span', { class: 'spinner' }), `메뉴 링크 ${reading}개에서 재료를 읽고 있어요…`));
    }

    const recs = recommend(stock, menuLibrary());
    if (!recs.length) {
      if (reading <= 0) useupBody.append(msg('남은 재료로 만들 만한 메뉴를 찾지 못했어요. 🛒 버튼으로 재료를 찾아둔 메뉴가 많을수록 잘 찾아요.'));
      return;
    }
    const ul = el('ul', { class: 'recs' });
    for (const r of recs) {
      const usedLine = el('span', { class: 'rec-line' }, '남은 재료: ');
      r.used.filter((s) => !isStaple(s.name)).forEach((s, i) => {
        if (i) usedLine.append(', ');
        usedLine.append(el('b', { class: s.left !== null && s.left <= 2 ? 'soon' : null }, s.name + (s.left !== null && s.left <= 5 ? ` (${leftText(s.left)})` : '')));
      });
      const second = r.byName
        ? el('span', { class: 'rec-line' }, '메뉴 이름으로 찾았어요')
        : el('span', { class: 'rec-line' }, r.missing.length ? `더 필요: ${r.missing.slice(0, 6).join(', ')}${r.missing.length > 6 ? ' 외' : ''}` : '재료가 다 있어요');
      const name = el('span', { class: 'rec-name' });
      if (r.e.url) name.insertAdjacentHTML('beforeend', ICONS[platform(r.e.url)]);
      name.append(r.e.name);
      const add = el('button', { class: 'btn primary', type: 'button' }, '식단에 넣기');
      add.addEventListener('click', () => {
        closeUseUp();
        openEditor(dateKey(new Date()), r.e.meal || 'dinner', null, document.getElementById('useup-open'), { text: r.e.name, url: r.e.url });
      });
      ul.append(el('li', { class: 'rec' }, el('div', { class: 'rec-main' }, name, usedLine, second), add));
    }
    useupBody.append(ul);
  }

  /* ---------- 함께 보기 (account) ---------- */
  const acct = document.getElementById('acct');
  const acctBody = document.getElementById('acct-body');
  function openAcct() { acct.hidden = false; document.documentElement.style.overflow = 'hidden'; renderAccount(); }
  function closeAcct() { acct.hidden = true; document.documentElement.style.overflow = ''; }
  document.getElementById('acct-open').addEventListener('click', openAcct);
  statusEl.addEventListener('click', openAcct);
  document.getElementById('acct-close').addEventListener('click', closeAcct);
  acct.addEventListener('click', (e) => { if (e.target === acct) closeAcct(); });

  function renderAccount() {
    const c = window.cloud;
    document.getElementById('acct-dot').hidden = !(c && c.live);
    if (c && c.error) setStatus('error', c.error);
    else if (c && c.live) setStatus('synced', '가족과 함께 보는 중');
    else if (c && c.user && c.ready) setStatus('local', '가족 코드를 연결하면 함께 볼 수 있어요');
    else setStatus('local', '이 기기에만 저장돼요 · 함께 보기');
    if (acct.hidden) return;

    const btn = (act, cls, label) => el('button', { class: 'btn ' + cls, type: 'button', 'data-acct': act }, label);
    acctBody.replaceChildren();
    if (!c || !c.ready) {
      acctBody.append(el('p', null, window.FIREBASE_CONFIG ? '연결을 준비하고 있어요…' : '이 버전에서는 함께 보기를 쓸 수 없어요.'));
    } else if (c.unavailable) {
      acctBody.append(el('p', null, '인터넷에 연결되면 함께 보기를 쓸 수 있어요. 식단은 이 기기에 그대로 저장돼요.'));
    } else if (!c.user) {
      acctBody.append(
        el('p', null, '구글로 로그인하면 휴대폰, 컴퓨터, 가족이 같은 식단을 봐요. 장보기 앱에서 쓰는 계정으로 로그인하면 같은 가족과 바로 연결돼요.'),
        el('div', { class: 'acct-row' }, btn('signin', 'primary', '구글로 로그인')));
    } else {
      acctBody.append(el('p', null, '로그인: ', el('span', { class: 'who' }, c.user.email || c.user.displayName || '')));
      if (!c.house) {
        acctBody.append(
          el('p', null, '장보기 앱의 가족 코드를 넣거나, 새 코드를 만드세요.'),
          el('div', { class: 'acct-row' },
            el('input', { id: 'acct-code', placeholder: '가족 코드', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', 'aria-label': '가족 코드' }),
            btn('join', 'primary', '연결')),
          el('div', { class: 'acct-row' }, btn('create', 'line', '새 가족 코드 만들기')));
      } else {
        acctBody.append(
          el('p', null, '가족 코드 · 가족이 이 코드로 연결하면 같은 식단을 봐요.'),
          el('div', { class: 'acct-row' }, el('span', { class: 'code' }, c.house), btn('copy', 'line', '복사')));
      }
      acctBody.append(el('div', { class: 'acct-row' }, btn('signout', 'ghost', '로그아웃')));
    }
    if (c && c.note) acctBody.append(el('p', { class: 'hint err' }, c.note));
  }

  acctBody.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-acct]');
    const c = window.cloud;
    if (!b || !c) return;
    const act = b.dataset.acct;
    c.note = '';
    if (act === 'copy') {
      try { await navigator.clipboard.writeText(c.house); b.textContent = '복사됨'; }
      catch { const r = document.createRange(); r.selectNodeContents(acctBody.querySelector('.code')); getSelection().removeAllRanges(); getSelection().addRange(r); }
      return;
    }
    b.disabled = true;
    try {
      if (act === 'signin') await c.signIn();
      else if (act === 'signout') await c.signOut();
      else if (act === 'create') await c.create();
      else if (act === 'join') {
        const ok = await c.join(document.getElementById('acct-code').value);
        if (!ok) c.note = '그 코드를 찾을 수 없어요. 다시 확인해 주세요';
      }
    } catch (err) {
      console.warn(err);
      if (!(err && /popup-closed|cancelled-popup/.test(err.code || '')))
        c.note = act === 'signin' ? '로그인하지 못했어요. 다시 시도해 주세요' : '연결하지 못했어요. 인터넷 연결을 확인해 주세요';
    }
    b.disabled = false;
    renderAccount();
  });

  board.addEventListener('click', (e) => {
    const shopBtn = e.target.closest('[data-shop]');
    if (shopBtn) { openShop(shopBtn.dataset.key, shopBtn.dataset.meal, shopBtn.dataset.shop, shopBtn); return; }
    const editBtn = e.target.closest('[data-edit]');
    if (editBtn) { openEditor(editBtn.dataset.key, editBtn.dataset.meal, editBtn.dataset.edit, editBtn); return; }
    if (e.target.closest('a')) return; // link opens in a new tab
    const slot = e.target.closest('.slot');
    if (slot) openEditor(slot.dataset.key, slot.dataset.meal, null, slot.querySelector('.add'));
  });

  /* ---------- week nav ---------- */
  document.getElementById('prev').addEventListener('click', () => { viewStart = addDays(viewStart, -7); render(); });
  document.getElementById('next').addEventListener('click', () => { viewStart = addDays(viewStart, 7); render(); });
  document.getElementById('today').addEventListener('click', () => { viewStart = startOfDay(new Date()); render(); });

  // Opening the app on a new day (it may have stayed open in the background) moves the view to today.
  let lastToday = dateKey(new Date());
  function followToday() {
    const now = dateKey(new Date());
    if (now === lastToday) return;
    if (dateKey(viewStart) === lastToday) viewStart = startOfDay(new Date());
    lastToday = now;
    render();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) followToday(); });
  setInterval(followToday, 60 * 1000);

  render();
  renderAccount();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
<script src="firebase-config.js"></script>
<script type="module">
// ---------- 함께 보기 (Firebase) ----------
// Same Firebase project and household as the 장보기 app: households/{가족 코드}.
// The meal plan lives in that document's `meals` field as meals.{YYYY-MM-DD} = { lunch, dinner, other };
// the 장보기 app never touches that field. Each change uploads one day, so two phones don't overwrite each other's days.
const cfg = window.FIREBASE_CONFIG, M = window.meals;
if (cfg && M) {
  const cloud = window.cloud = { ready: false, user: null, house: null, live: false, error: '', note: '' };
  M.refresh();
  let A, F, initializeApp;
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
    [{ initializeApp }, A, F] = await Promise.all(
      [import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  } catch (e) {
    console.warn('firebase', e);
    cloud.ready = true; cloud.unavailable = true; M.refresh();
  }
  if (A) {
    const fb = initializeApp(cfg), auth = A.getAuth(fb);
    const db = F.initializeFirestore(fb, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
    const house = () => F.doc(db, 'households', cloud.house);
    const field = (k) => new F.FieldPath('meals', k);
    let unsub = null;

    const fail = (e) => { console.warn('sync', e); cloud.error = '서버에 저장하지 못했어요. 인터넷 연결을 확인해 주세요'; M.refresh(); };
    const ok = () => { if (cloud.error) { cloud.error = ''; M.refresh(); } };

    function stop() { if (unsub) unsub(); unsub = null; cloud.live = false; }
    // Earlier versions wrote "메뉴 이름 · 양" into the 장보기 memo. Take the menu's name out again, keep the amount.
    function dropMenuNames(meals) {
      const menus = new Set(), args = [];
      for (const day of Object.values(meals)) for (const list of Object.values(day || {})) {
        if (Array.isArray(list)) for (const it of list) if (it && it.text) menus.add(it.text);
      }
      for (const [kind, all] of [['items', shopItems], ['stock', stockItems]]) for (const x of Object.values(all)) {
        if (!x || !x.id || !x.note) continue;
        const menu = [...menus].find((m) => x.note === m || x.note.startsWith(m + ' · '));
        if (!menu) continue;
        const rest = x.note.slice(menu.length + 3);
        args.push(new F.FieldPath(kind, x.id, 'note'), rest || F.deleteField());
      }
      if (args.length) F.updateDoc(house(), ...args).then(ok, fail);
    }
    function listen() {
      stop();
      let first = true;
      unsub = F.onSnapshot(house(), (snap) => {
        if (!snap.exists()) return;
        shopItems = snap.data().items || {};
        stockItems = snap.data().stock || {};
        const remote = JSON.parse(JSON.stringify(snap.data().meals || {}));
        if (first) {
          first = false;
          // First contact with this household on this device: add the days only this device has.
          // Afterwards: send only the days changed while not connected.
          const mine = M.days(), firstTime = M.syncedHouse() !== cloud.house, args = [];
          for (const k of Object.keys(mine)) {
            if ((firstTime && !remote[k]) || M.unsynced.has(k)) { args.push(field(k), mine[k]); remote[k] = mine[k]; }
          }
          for (const k of M.unsynced) if (!mine[k] && remote[k]) { args.push(field(k), F.deleteField()); delete remote[k]; }
          M.clearUnsynced();
          M.setSyncedHouse(cloud.house);
          if (args.length) F.updateDoc(house(), ...args).then(ok, fail);
          cloud.live = true;
        }
        M.setDays(remote);
        M.refresh();
        dropMenuNames(remote);
      }, (e) => { stop(); fail(e); });
    }
    async function link(code) {
      cloud.house = code;
      await F.setDoc(F.doc(db, 'users', auth.currentUser.uid), { house: code });
      listen();
    }

    cloud.push = (k, v) => F.updateDoc(house(), field(k), v === null ? F.deleteField() : v).then(ok, fail);

    // 장보기 app: things still to buy live in items.{id} = { id, store, name, note }; 'super' is the 슈퍼마켓 list.
    let shopItems = {}, stockItems = {};
    // 구입한 것: bought and not yet used up, { id, name, expires: 'YYYY-MM-DD' | null, loc, … }
    cloud.stockItems = () => Object.values(stockItems).filter((x) => x && x.name);
    const nameKey = (s) => String(s || '').trim().toLowerCase();
    cloud.idToken = () => auth.currentUser.getIdToken();
    cloud.shoppingNames = () => new Set(Object.values(shopItems).filter((x) => x && x.store === 'super').map((x) => nameKey(x.name)));
    cloud.addToShopping = (entries) => {
      const have = cloud.shoppingNames(), args = [];
      for (const e of entries) {
        const k = nameKey(e.name);
        if (!k || have.has(k)) continue;
        have.add(k);
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        args.push(new F.FieldPath('items', id), { id, store: 'super', name: e.name.trim(), ...(e.note && { note: e.note }) });
      }
      if (args.length) F.updateDoc(house(), ...args).then(ok, fail);
      return args.length / 2;
    };
    cloud.signIn = () => A.signInWithPopup(auth, new A.GoogleAuthProvider());
    cloud.signOut = async () => { stop(); cloud.house = null; await A.signOut(auth); };
    cloud.create = async () => {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = [...crypto.getRandomValues(new Uint8Array(10))].map((n) => abc[n % abc.length]).join('');
      await F.setDoc(F.doc(db, 'households', code), { stores: {}, items: {}, stock: {}, meals: {}, created: Date.now() });
      await link(code);
    };
    cloud.join = async (raw) => {
      const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!code || !(await F.getDoc(F.doc(db, 'households', code))).exists()) return false;
      await link(code);
      return true;
    };

    A.onAuthStateChanged(auth, async (user) => {
      cloud.user = user;
      if (!user) { stop(); cloud.house = null; }
      else if (!cloud.house) {
        try {
          const u = await F.getDoc(F.doc(db, 'users', user.uid));
          if (u.exists() && u.data().house) cloud.house = u.data().house;
        } catch (e) { console.warn('sync', e); }
        if (cloud.house) listen();
      }
      cloud.ready = true;
      M.refresh();
    });
  }
}
</script>
